<!DOCTYPE html>

<html lang="zh-Hant">

<head>

  <!-- ==================================================
       【開始】01－網頁基本設定

       【作用】
       1. 設定繁體中文網頁
       2. 設定手機與電腦顯示比例
       3. 設定瀏覽器分頁名稱
  =================================================== -->

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>自由品勢音樂庫</title>

  <!-- ==================================================
       【結束】01－網頁基本設定
  =================================================== -->



  <style>


    /* ==================================================
       【開始】02－全網站基本外觀

       【作用】
       1. 設定整個網站尺寸計算方式
       2. 設定網站背景
       3. 設定中文字體
       4. 設定主要文字顏色

       【以後如果要修改】
       網站整體背景、字體、基本文字顏色
       就修改這一區
    ================================================== */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      font-family:
        Arial,
        "Microsoft JhengHei",
        sans-serif;

      background: #0b0b12;

      color: white;
    }

    /* ==================================================
       【結束】02－全網站基本外觀
    ================================================== */





    /* ==================================================
       【開始】03－網站最上方標題外觀

       【作用】
       控制：
       1.「自由品勢音樂庫」標題
       2. 標題背景
       3. 標題大小
       4. 副標題文字

       【以後如果要修改】
       最上面紫色區域就修改這裡
    ================================================== */

    .header {

      width: 100%;

      text-align: center;

      padding: 42px 20px 32px;

      background:
        linear-gradient(
          135deg,
          #101018,
          #24104d
        );
    }


    .header h1 {

      margin: 0;

      font-size: 36px;

      font-weight: bold;
    }


    .header p {

      margin: 10px 0 0;

      color: #c9c9d8;

      font-size: 16px;
    }

    /* ==================================================
       【結束】03－網站最上方標題外觀
    ================================================== */





    /* ==================================================
       【開始】04－音樂列表區外觀

       【作用】
       控制音樂卡片放置的位置與寬度

       【以後如果要修改】
       整個歌曲列表寬度就修改這裡
    ================================================== */

    .music-list {

      width: 92%;

      max-width: 850px;

      margin: 30px auto 60px;
    }

    /* ==================================================
       【結束】04－音樂列表區外觀
    ================================================== */





    /* ==================================================
       【開始】05－歌曲卡片外觀

       【作用】
       控制每一首歌曲外面的卡片

       包含：
       1. 卡片背景
       2. 圓角
       3. 邊框
       4. 內部距離
    ================================================== */

    .music-card {

      padding: 20px;

      background: #15151e;

      border: 1px solid #30303d;

      border-radius: 18px;
    }


    .music-title {

      margin: 0;

      font-size: 21px;
    }


    .music-info {

      margin-top: 8px;

      color: #9999aa;

      font-size: 14px;
    }

    /* ==================================================
       【結束】05－歌曲卡片外觀
    ================================================== */





    /* ==================================================
       【開始】06－播放器外觀

       【作用】
       控制白色播放器整體外觀

       包含：
       1. 播放按鈕
       2. 時間
       3. 進度條
       4. 音量
    ================================================== */

    .player {

      display: flex;

      align-items: center;

      gap: 10px;

      width: 100%;

      margin-top: 20px;

      padding: 10px 12px;

      background: white;

      color: #222;

      border-radius: 50px;
    }

    /* ==================================================
       【結束】06－播放器外觀
    ================================================== */





    /* ==================================================
       【開始】07－播放／暫停按鈕外觀

       【作用】
       控制圓形 ▶ 播放按鈕的外觀

       【注意】
       這裡只控制「長什麼樣子」
       不控制播放功能
    ================================================== */

    .play-button {

      width: 46px;

      height: 46px;

      flex-shrink: 0;

      border: none;

      border-radius: 50%;

      background: #6c45e8;

      color: white;

      font-size: 18px;

      cursor: pointer;
    }

    /* ==================================================
       【結束】07－播放／暫停按鈕外觀
    ================================================== */





    /* ==================================================
       【開始】08－播放時間外觀

       【作用】
       控制：
       0:00 / 1:34
       這個時間文字的大小與位置
    ================================================== */

    .time-display {

      min-width: 90px;

      text-align: center;

      font-size: 12px;

      white-space: nowrap;
    }

    /* ==================================================
       【結束】08－播放時間外觀
    ================================================== */





    /* ==================================================
       【開始】09－播放進度條外觀

       【作用】
       控制歌曲播放進度條的寬度
    ================================================== */

    .progress-bar {

      flex: 1;

      min-width: 50px;

      cursor: pointer;
    }

    /* ==================================================
       【結束】09－播放進度條外觀
    ================================================== */





    /* ==================================================
       【開始】10－音量控制外觀

       【作用】
       控制：
       1. 🔊 音量圖示
       2. 音量調整拉桿
    ================================================== */

    .volume-icon {

      font-size: 18px;

      flex-shrink: 0;

      cursor: pointer;
    }


    .volume-control {

      width: 75px;

      cursor: pointer;
    }

    /* ==================================================
       【結束】10－音量控制外觀
    ================================================== */





    /* ==================================================
       【開始】11－音樂檔測試區外觀

       【作用】
       這是一個「檢查音樂檔案」用的區域。

       如果自訂播放器有問題，
       可以暫時把測試播放器顯示出來，
       確認 music01.mp3 是否真的讀得到。

       正式使用時預設隱藏。
    ================================================== */

    .audio-test {

      display: none;

      width: 100%;

      margin-top: 15px;
    }

    /* ==================================================
       【結束】11－音樂檔測試區外觀
    ================================================== */





    /* ==================================================
       【開始】12－手機版外觀

       【作用】
       當手機螢幕小於 650px 時，
       自動調整標題、播放器與音量大小
    ================================================== */

    @media (max-width: 650px) {

      .header {

        padding: 34px 15px 26px;
      }


      .header h1 {

        font-size: 29px;
      }


      .header p {

        font-size: 14px;
      }


      .music-list {

        width: 94%;

        margin-top: 20px;
      }


      .music-card {

        padding: 16px;
      }


      .player {

        gap: 6px;

        padding: 8px;
      }


      .play-button {

        width: 42px;

        height: 42px;
      }


      .time-display {

        min-width: 76px;

        font-size: 11px;
      }


      .volume-control {

        width: 50px;
      }

    }

    /* ==================================================
       【結束】12－手機版外觀
    ================================================== */


  </style>

</head>



<body>


  <!-- ==================================================
       【開始】13－網站標題

       【作用】
       顯示網站最上面的：

       自由品勢音樂庫
       自由品勢音樂線上試聽

       【以後如果要改名稱】
       就修改這一區
  ================================================== -->

  <header class="header">

    <h1>
      自由品勢音樂庫
    </h1>

    <p>
      自由品勢音樂線上試聽
    </p>

  </header>

  <!-- ==================================================
       【結束】13－網站標題
  ================================================== -->





  <!-- ==================================================
       【開始】14－音樂列表

       【作用】
       所有歌曲都放在這個區域。

       以後：
       music01
       music02
       music03
       都會放在這裡。
  ================================================== -->

  <main class="music-list">





    <!-- ==================================================
         【開始】15－第一首歌曲 music01

         【作用】
         這整個區域代表第一首歌曲。

         包含：
         1. 歌曲名稱
         2. 歌曲資料
         3. music01.mp3
         4. 播放器

         【以後如果要修改第一首歌曲】
         就找：
         【開始】15－第一首歌曲 music01
         到
         【結束】15－第一首歌曲 music01
    ================================================== -->

    <section class="music-card">


      <!-- ==================================================
           【開始】15-01－歌曲名稱

           【作用】
           顯示第一首歌曲名稱
      ================================================== -->

      <h2 class="music-title">
        自由品勢音樂 01
      </h2>

      <!-- ==================================================
           【結束】15-01－歌曲名稱
      ================================================== -->





      <!-- ==================================================
           【開始】15-02－歌曲資料

           【作用】
           顯示歌曲類型、用途、秒數
      ================================================== -->

      <div class="music-info">
        純音樂｜自由品勢｜94秒
      </div>

      <!-- ==================================================
           【結束】15-02－歌曲資料
      ================================================== -->





      <!-- ==================================================
           【開始】15-03－音樂檔案

           【作用】
           告訴網站要播放哪一個音樂檔。

           現在指定：
           music01.mp3

           【非常重要】
           index.html
           music01.mp3

           這兩個檔案必須放在 GitHub
           taekwondo-music 專案的同一層。

           【以後如果要換歌曲】
           主要就是修改：
           src="./music01.mp3"
      ================================================== -->

      <audio
        id="music01"
        preload="metadata"
      >

        <source
          src="./music01.mp3"
          type="audio/mpeg"
        >

        您的瀏覽器不支援音樂播放。

      </audio>

      <!-- ==================================================
           【結束】15-03－音樂檔案
      ================================================== -->





      <!-- ==================================================
           【開始】15-04－音樂檔測試

           【作用】
           這是故障檢查用。

           正常情況：
           不會顯示。

           如果以後發生：
           「音樂沒有聲音」
           「不知道 MP3 有沒有讀到」

           就把上面的 CSS：

           display: none;

           改成：

           display: block;

           就會出現瀏覽器自己的播放器，
           可以直接測試 music01.mp3。

           這一區不影響正式播放器。
      ================================================== -->

      <audio
        class="audio-test"
        controls
        preload="metadata"
      >

        <source
          src="./music01.mp3"
          type="audio/mpeg"
        >

      </audio>

      <!-- ==================================================
           【結束】15-04－音樂檔測試
      ================================================== -->





      <!-- ==================================================
           【開始】15-05－正式播放器

           【作用】
           顯示正式使用的播放器。

           包含：
           ▶ 播放／暫停
           時間
           進度條
           🔊 音量
      ================================================== -->

      <div class="player">


        <!-- ================================================
             【開始】15-05-01－播放／暫停按鈕

             【作用】
             點 ▶ 開始播放
             播放中顯示 ⏸
             再按一次暫停
        ================================================= -->

        <button
          id="playButton"
          class="play-button"
          type="button"
          aria-label="播放或暫停"
        >
          ▶
        </button>

        <!-- ================================================
             【結束】15-05-01－播放／暫停按鈕
        ================================================= -->





        <!-- ================================================
             【開始】15-05-02－播放時間

             【作用】
             顯示：

             目前時間 / 歌曲總時間

             例如：
             0:25 / 1:34
        ================================================= -->

        <div
          id="timeDisplay"
          class="time-display"
        >
          0:00 / 0:00
        </div>

        <!-- ================================================
             【結束】15-05-02－播放時間
        ================================================= -->





        <!-- ================================================
             【開始】15-05-03－播放進度條

             【作用】
             1. 顯示歌曲目前播放位置
             2. 可以用手指左右拉動
             3. 可以跳到歌曲指定位置
        ================================================= -->

        <input
          id="progressBar"
          class="progress-bar"
          type="range"
          min="0"
          max="100"
          value="0"
          step="0.1"
          aria-label="播放進度"
        >

        <!-- ================================================
             【結束】15-05-03－播放進度條
        ================================================= -->





        <!-- ================================================
             【開始】15-05-04－音量圖示

             【作用】
             顯示 🔊
             點一下可以靜音／恢復聲音
        ================================================= -->

        <span
          id="volumeIcon"
          class="volume-icon"
          role="button"
          tabindex="0"
          aria-label="靜音或恢復聲音"
        >
          🔊
        </span>

        <!-- ================================================
             【結束】15-05-04－音量圖示
        ================================================= -->





        <!-- ================================================
             【開始】15-05-05－音量拉桿

             【作用】
             左右拉動調整歌曲音量

             0 = 沒有聲音
             1 = 最大音量
        ================================================= -->

        <input
          id="volumeControl"
          class="volume-control"
          type="range"
          min="0"
          max="1"
          value="1"
          step="0.01"
          aria-label="音量"
        >

        <!-- ================================================
             【結束】15-05-05－音量拉桿
        ================================================= -->


      </div>

      <!-- ==================================================
           【結束】15-05－正式播放器
      ================================================== -->


    </section>

    <!-- ==================================================
         【結束】15－第一首歌曲 music01
    ================================================== -->


  </main>

  <!-- ==================================================
       【結束】14－音樂列表
  ================================================== -->





  <script>


    /* ==================================================
       【開始】16－播放器元件連接

       【作用】
       讓 JavaScript 找到：

       music01 音樂
       播放按鈕
       時間
       進度條
       音量圖示
       音量拉桿

       後面的功能全部使用這些元件。
    ================================================== */

    const audio =
      document.getElementById("music01");

    const playButton =
      document.getElementById("playButton");

    const timeDisplay =
      document.getElementById("timeDisplay");

    const progressBar =
      document.getElementById("progressBar");

    const volumeIcon =
      document.getElementById("volumeIcon");

    const volumeControl =
      document.getElementById("volumeControl");

    /* ==================================================
       【結束】16－播放器元件連接
    ================================================== */





    /* ==================================================
       【開始】17－時間格式轉換

       【作用】
       把電腦的「秒數」轉換成我們看得懂的時間。

       例如：

       0秒 → 0:00
       25秒 → 0:25
       94秒 → 1:34
       95秒 → 1:35
    ================================================== */

    function formatTime(seconds) {

      if (!Number.isFinite(seconds)) {

        return "0:00";

      }


      const minutes =
        Math.floor(seconds / 60);


      const remainingSeconds =
        Math.floor(seconds % 60);


      return (
        minutes +
        ":" +
        String(remainingSeconds).padStart(2, "0")
      );

    }

    /* ==================================================
       【結束】17－時間格式轉換
    ================================================== */





    /* ==================================================
       【開始】18－讀取歌曲總時間

       【作用】
       music01.mp3 載入完成後，
       自動讀取真正的歌曲長度。

       例如：

       0:00 / 1:34
    ================================================== */

    audio.addEventListener(
      "loadedmetadata",
      function () {

        timeDisplay.textContent =
          "0:00 / " +
          formatTime(audio.duration);

      }
    );

    /* ==================================================
       【結束】18－讀取歌曲總時間
    ================================================== */





    /* ==================================================
       【開始】19－播放／暫停功能

       【作用】

       如果音樂目前停止：
       ▶ → 開始播放

       如果音樂正在播放：
       ⏸ → 暫停

       這就是正式控制音樂播放的地方。
    ================================================== */

    playButton.addEventListener(
      "click",
      function () {

        if (audio.paused) {

          audio.play()
            .then(function () {

              playButton.textContent = "⏸";

            })
            .catch(function (error) {

              console.error(
                "音樂播放失敗：",
                error
              );

              alert(
                "音樂無法播放，請檢查 music01.mp3 是否已經正確上傳。"
              );

            });

        } else {

          audio.pause();

          playButton.textContent = "▶";

        }

      }
    );

    /* ==================================================
       【結束】19－播放／暫停功能
    ================================================== */





    /* ==================================================
       【開始】20－播放時間自動更新

       【作用】
       音樂播放時，
       不斷更新：

       1. 目前播放時間
       2. 歌曲總時間
       3. 播放進度條位置
    ================================================== */

    audio.addEventListener(
      "timeupdate",
      function () {

        timeDisplay.textContent =
          formatTime(audio.currentTime) +
          " / " +
          formatTime(audio.duration);


        if (
          Number.isFinite(audio.duration) &&
          audio.duration > 0
        ) {

          progressBar.value =
            (
              audio.currentTime /
              audio.duration
            ) * 100;

        }

      }
    );

    /* ==================================================
       【結束】20－播放時間自動更新
    ================================================== */





    /* ==================================================
       【開始】21－手動拉動播放進度

       【作用】
       使用者拉動進度條時，
       直接跳到歌曲指定位置。

       例如：
       拉到一半 → 跳到歌曲中間。
    ================================================== */

    progressBar.addEventListener(
      "input",
      function () {

        if (
          !Number.isFinite(audio.duration) ||
          audio.duration <= 0
        ) {

          return;

        }


        audio.currentTime =
          (
            Number(progressBar.value) /
            100
          ) *
          audio.duration;

      }
    );

    /* ==================================================
       【結束】21－手動拉動播放進度
    ================================================== */





    /* ==================================================
       【開始】22－音量拉桿功能

       【作用】
       左右拉動音量控制：

       0 = 靜音
       1 = 最大聲

       同時自動切換：
       🔇
       🔉
       🔊
    ================================================== */

    volumeControl.addEventListener(
      "input",
      function () {

        const volume =
          Number(volumeControl.value);


        audio.volume = volume;

        audio.muted = false;


        if (volume === 0) {

          volumeIcon.textContent = "🔇";

        } else if (volume < 0.5) {

          volumeIcon.textContent = "🔉";

        } else {

          volumeIcon.textContent = "🔊";

        }

      }
    );

    /* ==================================================
       【結束】22－音量拉桿功能
    ================================================== */





    /* ==================================================
       【開始】23－點音量圖示靜音

       【作用】

       點 🔊：
       立即靜音 → 🔇

       再點 🔇：
       恢復聲音
    ================================================== */

    volumeIcon.addEventListener(
      "click",
      function () {

        audio.muted =
          !audio.muted;


        if (audio.muted) {

          volumeIcon.textContent = "🔇";

        } else {

          const volume =
            Number(volumeControl.value);


          if (volume === 0) {

            volumeIcon.textContent = "🔇";

          } else if (volume < 0.5) {

            volumeIcon.textContent = "🔉";

          } else {

            volumeIcon.textContent = "🔊";

          }

        }

      }
    );

    /* ==================================================
       【結束】23－點音量圖示靜音
    ================================================== */





    /* ==================================================
       【開始】24－歌曲播放完畢

       【作用】
       music01 播放到最後時：

       1. 播放按鈕恢復 ▶
       2. 進度條回到最前面
       3. 播放時間回到 0:00
    ================================================== */

    audio.addEventListener(
      "ended",
      function () {

        playButton.textContent = "▶";

        progressBar.value = 0;

        audio.currentTime = 0;


        timeDisplay.textContent =
          "0:00 / " +
          formatTime(audio.duration);

      }
    );

    /* ==================================================
       【結束】24－歌曲播放完畢
    ================================================== */





    /* ==================================================
       【開始】25－音樂檔錯誤檢查

       【作用】
       如果網站找不到 music01.mp3，
       在瀏覽器 Console 顯示錯誤。

       這個功能主要是以後維修網站時使用。
    ================================================== */

    audio.addEventListener(
