<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>自由品勢音樂庫</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #0b0b12;
      color: white;
    }

    .header {
      text-align: center;
      padding: 45px 20px 30px;
      background: linear-gradient(135deg, #101018, #24104d);
    }

    .header h1 {
      margin: 0;
      font-size: 38px;
    }

    .header p {
      margin-top: 12px;
      color: #c9c9d8;
      font-size: 17px;
    }

    .controls {
      width: 90%;
      max-width: 900px;
      margin: 25px auto 10px;
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 10px;
    }

    .search-box,
    .category-select {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: #1c1c27;
      color: white;
      font-size: 16px;
    }

    .tabs {
      width: 90%;
      max-width: 900px;
      margin: 15px auto;
      display: flex;
      gap: 10px;
    }

    .tab-button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: #242432;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .tab-button.active {
      background: #744cff;
    }

    .stats {
      width: 90%;
      max-width: 900px;
      margin: 15px auto 25px;
      color: #b7b7c8;
      font-size: 14px;
    }

    .music-list {
      width: 90%;
      max-width: 900px;
      margin: 0 auto;
    }

    .music-card {
      background: #181821;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 22px;
      box-shadow: 0 0 25px rgba(120, 70, 255, 0.20);
    }

    .music-card h2 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 25px;
    }

    .info {
      color: #bdbdcc;
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 12px;
    }

    .download-count {
      color: #9898aa;
      font-size: 14px;
      margin-bottom: 15px;
    }

    /* =========================
       自製播放器
       ========================= */

    .player-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    .custom-player {
      flex: 1;
      min-width: 0;
      height: 54px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      border-radius: 28px;
      background: #f2f2f2;
      color: #222;
    }

    .play-button {
      border: none;
      background: transparent;
      color: #222;
      width: 32px;
      height: 32px;
      padding: 0;
      font-size: 21px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .time-display {
      color: #555;
      font-size: 14px;
      white-space: nowrap;
      min-width: 82px;
    }

    .progress {
      flex: 1;
      min-width: 40px;
      cursor: pointer;
    }

    .volume-button {
      border: none;
      background: transparent;
      color: #222;
      font-size: 20px;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* 愛心 */

    .heart-button {
      width: 50px;
      height: 50px;
      border: none;
      border-radius: 50%;
      background: #292936;
      color: #b7b7c8;
      font-size: 24px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .heart-button.active {
      color: #ff4f75;
      background: #352b38;
    }

    /* 自訂三點 */

    .menu-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .menu-button {
      width: 50px;
      height: 50px;
      border: none;
      border-radius: 50%;
      background: #292936;
      color: white;
      font-size: 25px;
      cursor: pointer;
    }

    .song-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 58px;
      width: 190px;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.40);
      z-index: 1000;
    }

    .song-menu.show {
      display: block;
    }

    .menu-item {
      width: 100%;
      padding: 15px 18px;
      border: none;
      background: white;
      color: #222;
      text-align: left;
      font-size: 16px;
      cursor: pointer;
    }

    .menu-item:hover {
      background: #eeeeee;
    }

    .menu-divider {
      height: 1px;
      background: #dddddd;
    }

    .empty {
      text-align: center;
      color: #9999aa;
      padding: 50px 20px;
    }

    .footer {
      text-align: center;
      padding: 35px 20px;
      color: #777788;
      font-size: 13px;
    }

    @media (max-width: 650px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 31px;
      }

      .music-card {
        padding: 18px;
      }

      .custom-player {
        gap: 7px;
        padding: 0 10px;
      }

      .time-display {
        min-width: 70px;
        font-size: 12px;
      }

      .heart-button,
      .menu-button {
        width: 46px;
        height: 46px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>自由品勢音樂庫</h1>

    <p>
      高品質剪輯・自由品勢專用・線上試聽・下載使用
    </p>
  </div>


  <!-- 搜尋與分類 -->

  <div class="controls">

    <input
      id="searchInput"
      class="search-box"
      type="text"
      placeholder="🔎 搜尋音樂..."
      oninput="renderSongs()"
    >

    <select
      id="categorySelect"
      class="category-select"
      onchange="handleCategoryChange()"
    >
      <option value="全部">全部分類</option>
      <option value="震撼">震撼</option>
      <option value="東方">東方武術</option>
      <option value="電子">電子</option>
      <option value="優雅">優雅</option>
      <option value="剪輯">✂️ 音樂剪輯</option>
    </select>

  </div>


  <!-- 全部音樂 / 我的最愛 -->

  <div class="tabs">

    <button
      id="allTab"
      class="tab-button active"
      onclick="showAllSongs()"
    >
      🎵 全部音樂
    </button>

    <button
      id="favoriteTab"
      class="tab-button"
      onclick="showFavorites()"
    >
      ♥ 我的最愛
    </button>

  </div>


  <div id="stats" class="stats"></div>

  <div id="musicList" class="music-list"></div>

  <div class="footer">
    自由品勢音樂庫
  </div>


  <script>

/* =========================
   音樂剪輯頁面切換
========================= */

function handleCategoryChange() {

  const category =
    document.getElementById("categorySelect").value;

  if (category === "剪輯") {

    showMusicEditor();

  } else {

    const editor =
      document.getElementById("musicEditor");

    if (editor) {
      editor.style.display = "none";
    }

    document.getElementById("musicList").style.display = "";
    document.getElementById("stats").style.display = "";

    renderSongs();
  }
}

function showMusicEditor() {

  document.getElementById("musicList").style.display = "none";
  document.getElementById("stats").style.display = "none";

  let editor =
    document.getElementById("musicEditor");

  if (!editor) {

    editor = document.createElement("div");
    editor.id = "musicEditor";
    editor.className = "music-list";

    editor.innerHTML = `
      <div class="music-card" style="text-align:center;">

        <h2>✂️ 音樂剪輯工作室</h2>

        <div class="info">
          自由切割、排列音樂片段並加入音效
        </div>

      <input
  id="musicFileInput"
  type="file"
  accept="audio/*"
  multiple
  style="display:none;"
>

<button
  type="button"
  onclick="document.getElementById('musicFileInput').click()"
  style="
    width:100%;
    max-width:320px;
    padding:16px;
    margin-top:15px;
    border:0;
    border-radius:14px;
    background:#744cff;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
  "
>
  ＋ 加入音樂
</button>

        <p style="
          color:#9999aa;
          margin-top:20px;
        ">
          剪輯時間軸將顯示在這裡
        </p>

      </div>
    `;

    document
      .getElementById("musicList")
      .insertAdjacentElement(
        "afterend",
        editor
      );
  }

  editor.style.display = "";
}
/* =========================
   選擇音樂後加入剪輯工作室
   波形剪輯版
========================= */

let editorAudioContext = null;
let editorSources = [];

document.addEventListener("change", async function(event) {

  if (event.target.id !== "musicFileInput") {
    return;
  }

  const files = Array.from(event.target.files);

  if (files.length === 0) {
    return;
  }

  const editor =
    document.getElementById("musicEditor");

  let area =
    document.getElementById("loadedMusicArea");

  if (!area) {

    area = document.createElement("div");
    area.id = "loadedMusicArea";

    area.style.cssText = `
      margin-top:20px;
      text-align:left;
    `;

    editor
      .querySelector(".music-card")
      .appendChild(area);

    /* 成品剪輯軌 */
    const finalTrack =
      document.createElement("div");

    finalTrack.id = "finalTrack";

    finalTrack.innerHTML = `
      <div style="
        margin-top:25px;
        font-weight:bold;
        color:white;
      ">
        🎬 成品剪輯軌
      </div>

      <div
        id="finalTrackArea"
        style="
          min-height:90px;
          margin-top:10px;
          padding:12px;
          border:2px dashed #744cff;
          border-radius:14px;
          background:#101018;
          color:#888;
        "
      >
        剪下來的音樂片段之後會放在這裡
      </div>

      <div style="
        margin-top:10px;
        color:#aaa;
        font-size:14px;
      ">
        目標長度：01:34～01:35
      </div>
    `;

    area.appendChild(finalTrack);

    /* 音效軌 */
    const effectTrack =
      document.createElement("div");

    effectTrack.id = "effectTrack";

    effectTrack.innerHTML = `
      <div style="
        margin-top:25px;
        font-weight:bold;
        color:white;
      ">
        ⚡ 音效軌
      </div>

      <div
        id="effectTrackArea"
        style="
          min-height:80px;
          margin-top:10px;
          padding:12px;
          border:2px dashed #555;
          border-radius:14px;
          background:#101018;
          color:#888;
        "
      >
        重擊、雷電、刀劍、破風等音效之後會放在這裡
      </div>
    `;

    area.appendChild(effectTrack);
  }

  if (!editorAudioContext) {

    editorAudioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();
  }

  for (const file of files) {

    try {

      const arrayBuffer =
        await file.arrayBuffer();

      const audioBuffer =
        await editorAudioContext
          .decodeAudioData(arrayBuffer);

      createWaveformEditor(
        file,
        audioBuffer,
        area
      );

    } catch (error) {

      console.error(error);

      alert(
        "這個音樂格式目前無法讀取：\n" +
        file.name
      );
    }
  }

  event.target.value = "";
});


/* =========================
   建立音樂波形
========================= */

function createWaveformEditor(
  file,
  audioBuffer,
  area
) {

  const sourceIndex =
    editorSources.length;

  const source = {
    file: file,
    buffer: audioBuffer,
    playhead: 0,
    audioSource: null,
    playing: false,
    startedAt: 0,
    animationId: null,
    cuts: []
  };

  editorSources.push(source);

  const musicBox =
    document.createElement("div");

  musicBox.style.cssText = `
    background:#101018;
    padding:15px;
    margin-top:15px;
    border-radius:14px;
  `;

  const title =
    document.createElement("div");

  title.textContent =
    "🎵 原始音樂 " +
    (sourceIndex + 1) +
    "｜" +
    file.name;

  title.style.cssText = `
    color:white;
    font-weight:bold;
    margin-bottom:12px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  `;

  const canvas =
    document.createElement("canvas");

  canvas.width = 1000;
  canvas.height = 180;

  canvas.style.cssText = `
    width:100%;
    height:130px;
    display:block;
    background:#191925;
    border-radius:10px;
    touch-action:none;
    cursor:pointer;
  `;

  source.canvas = canvas;

  const controls =
    document.createElement("div");

  controls.style.cssText = `
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:10px;
  `;

  const playButton =
    document.createElement("button");

  playButton.textContent = "▶ 播放";

  playButton.style.cssText = `
    border:0;
    border-radius:10px;
    padding:10px 14px;
    background:#744cff;
    color:white;
    font-weight:bold;
  `;

  const cutButton =
    document.createElement("button");

  cutButton.textContent = "✂️ 剪一刀";

  cutButton.style.cssText = `
    border:0;
    border-radius:10px;
    padding:10px 14px;
    background:#333342;
    color:white;
    font-weight:bold;
  `;

  const timeDisplay =
    document.createElement("span");

  timeDisplay.style.cssText = `
    margin-left:auto;
    color:#ddd;
    font-size:14px;
  `;

  source.timeDisplay = timeDisplay;
  source.playButton = playButton;

  playButton.addEventListener(
    "click",
    function() {
      toggleEditorSource(sourceIndex);
    }
  );

  cutButton.addEventListener(
    "click",
    function() {
      addEditorCut(sourceIndex);
    }
  );

  canvas.addEventListener(
    "pointerdown",
    function(event) {

      const rect =
        canvas.getBoundingClientRect();

      const x =
        event.clientX - rect.left;

      const ratio =
        Math.max(
          0,
          Math.min(
            1,
            x / rect.width
          )
        );

      stopEditorSource(sourceIndex);

      source.playhead =
        ratio * audioBuffer.duration;

      drawEditorWaveform(sourceIndex);
    }
  );

  controls.appendChild(playButton);
  controls.appendChild(cutButton);
  controls.appendChild(timeDisplay);

  musicBox.appendChild(title);
  musicBox.appendChild(canvas);
  musicBox.appendChild(controls);

  /* 放在成品軌前面 */
  const finalTrack =
    document.getElementById("finalTrack");

  area.insertBefore(
    musicBox,
    finalTrack
  );

 
drawEditorWaveform(sourceIndex);
enableSelectionHandles(sourceIndex);
}

    


/* =========================
   畫波形＋播放線＋切割線
========================= */

function drawEditorWaveform(index) {
  const source = editorSources[index];

  if (!source) {
    return;
  }

  const canvas = source.canvas;
  const ctx = canvas.getContext("2d");

  const width = canvas.width;
  const height = canvas.height;

  ctx.clearRect(
    0,
    0,
    width,
    height
  );

  ctx.fillStyle = "#191925";

  ctx.fillRect(
    0,
    0,
    width,
    height
  );

  const data =
    source.buffer.getChannelData(0);

  const step =
    Math.ceil(
      data.length / width
    );

  const middle =
    height / 2;

  ctx.strokeStyle = "#8d72ff";
  ctx.lineWidth = 2;

  ctx.beginPath();

  for (
    let x = 0;
    x < width;
    x++
  ) {
    let min = 1;
    let max = -1;

    const start =
      x * step;

    const end =
      Math.min(
        start + step,
        data.length
      );

    for (
      let i = start;
      i < end;
      i++
    ) {
      const value = data[i];

      if (value < min) {
        min = value;
      }

      if (value > max) {
        max = value;
      }
    }

    ctx.moveTo(
      x,
      middle +
        min *
        middle *
        0.85
    );

    ctx.lineTo(
      x,
      middle +
        max *
        middle *
        0.85
    );
  }

  ctx.stroke();

  /* 選取範圍 */

  const duration =
    source.buffer.duration;

  if (
    typeof source.selectionStart !== "number"
  ) {
    source.selectionStart = 0;
  }

  if (
    typeof source.selectionEnd !== "number"
  ) {
    source.selectionEnd = duration;
  }

  const startX =
    (
      source.selectionStart /
      duration
    ) * width;

  const endX =
    (
      source.selectionEnd /
      duration
    ) * width;

  ctx.fillStyle =
    "rgba(99, 102, 241, 0.25)";

  ctx.fillRect(
    startX,
    0,
    Math.max(
      2,
      endX - startX
    ),
    height
  );

  /* 左右兩條白色把手 */

  const handleWidth = 10;

  ctx.fillStyle = "#ffffff";

  ctx.fillRect(
    startX -
      handleWidth / 2,
    0,
    handleWidth,
    height
  );

  ctx.fillRect(
    endX -
      handleWidth / 2,
    0,
    handleWidth,
    height
  );

  /* 已剪切的位置 */

  ctx.strokeStyle = "#ffcc66";
  ctx.lineWidth = 2;

  source.cuts.forEach(
    function(cutTime) {

      const cutX =
        (
          cutTime /
          duration
        ) * width;

      ctx.beginPath();

      ctx.moveTo(
        cutX,
        0
      );

      ctx.lineTo(
        cutX,
        height
      );

      ctx.stroke();
    }
  );

  /* 白色播放位置線 */

  const playX =
    (
      source.playhead /
      duration
    ) * width;

  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 2;

  ctx.beginPath();

  ctx.moveTo(
    playX,
    0
  );

  ctx.lineTo(
    playX,
    height
  );

  ctx.stroke();

  /* 更新時間 */

  if (source.timeDisplay) {
    source.timeDisplay.textContent =
      formatEditorTime(
        source.playhead
      ) +
      " / " +
      formatEditorTime(
        duration
      );
  }
}










    

/* =========================
   播放 / 暫停原始音樂
========================= */

function toggleEditorSource(index) {

  const source =
    editorSources[index];

  if (source.playing) {

    const elapsed =
      editorAudioContext.currentTime -
      source.startedAt;

    source.playhead += elapsed;

    if (
      source.playhead >
      source.buffer.duration
    ) {
      source.playhead = 0;
    }

    stopEditorSource(index);

    return;
  }

  /* 先停止其他原始音樂 */
  editorSources.forEach(
    function(item, otherIndex) {

      if (
        otherIndex !== index &&
        item.playing
      ) {
        stopEditorSource(otherIndex);
      }
    }
  );

  if (
    source.playhead >=
    source.buffer.duration
  ) {
    source.playhead = 0;
  }

  const node =
    editorAudioContext
      .createBufferSource();

  node.buffer = source.buffer;

  node.connect(
    editorAudioContext.destination
  );

  node.start(
    0,
    source.playhead
  );

  source.audioSource = node;
  source.playing = true;
  source.startedAt =
    editorAudioContext.currentTime;

  source.playButton.textContent =
    "⏸ 暫停";

  const startPosition =
    source.playhead;

  function update() {

    if (!source.playing) {
      return;
    }

    const elapsed =
      editorAudioContext.currentTime -
      source.startedAt;

    source.playhead =
      startPosition + elapsed;

    if (
      source.playhead >=
      source.buffer.duration
    ) {

      source.playhead =
        source.buffer.duration;

      source.playing = false;

      source.playButton.textContent =
        "▶ 播放";

      drawEditorWaveform(index);

      return;
    }

    drawEditorWaveform(index);

    source.animationId =
      requestAnimationFrame(update);
  }

  update();
}


/* =========================
   停止原始音樂
========================= */

function stopEditorSource(index) {

  const source =
    editorSources[index];

  if (!source) {
    return;
  }

  if (source.audioSource) {

    try {
      source.audioSource.stop();
    } catch (error) {
    }

    source.audioSource = null;
  }

  if (source.animationId) {

    cancelAnimationFrame(
      source.animationId
    );

    source.animationId = null;
  }

  source.playing = false;

  if (source.playButton) {

    source.playButton.textContent =
      "▶ 播放";
  }

  drawEditorWaveform(index);
}


/* =========================
   剪刀：目前位置切一刀
========================= */

function addEditorCut(index) {

  const source =
    editorSources[index];

  if (!source) {
    return;
  }

  const cutTime =
    source.playhead;

  if (
    cutTime <= 0 ||
    cutTime >=
      source.buffer.duration
  ) {
    return;
  }

  const exists =
    source.cuts.some(
      function(time) {
        return (
          Math.abs(
            time - cutTime
          ) < 0.05
        );
      }
    );

  if (!exists) {

    source.cuts.push(cutTime);

    source.cuts.sort(
      function(a, b) {
        return a - b;
      }
    );
  }

  drawEditorWaveform(index);
}


/* =========================
   剪輯時間格式
========================= */

function formatEditorTime(seconds) {

  if (!isFinite(seconds)) {
    return "0:00";
  }

  const minutes =
    Math.floor(seconds / 60);

  const secs =
    Math.floor(seconds % 60)
      .toString()
      .padStart(2, "0");

  return minutes + ":" + secs;
}

/* =========================
   拖動左右白色把手選取片段
========================= */
function enableSelectionHandles(index) {
  const source = editorSources[index];

  if (!source || !source.canvas || !source.buffer) {
    return;
  }

  const canvas = source.canvas;

  canvas.style.touchAction = "none";

  let dragging = null;

  function getPosition(event) {
    const rect = canvas.getBoundingClientRect();

    const x =
      Math.max(
        0,
        Math.min(
          rect.width,
          event.clientX - rect.left
        )
      );

    return (
      x /
      rect.width *
      source.buffer.duration
    );
  }

  function pointerDown(event) {
    const duration = source.buffer.duration;
    const rect = canvas.getBoundingClientRect();

    const startX =
      source.selectionStart /
      duration *
      rect.width;

    const endX =
      source.selectionEnd /
      duration *
      rect.width;

    const pointerX =
      event.clientX - rect.left;

    const startDistance =
      Math.abs(pointerX - startX);

    const endDistance =
      Math.abs(pointerX - endX);

    const hitArea = 25;

    if (
      startDistance <= hitArea &&
      startDistance <= endDistance
    ) {
      dragging = "start";
    } else if (endDistance <= hitArea) {
      dragging = "end";
    } else {
      return;
    }

    canvas.setPointerCapture(event.pointerId);

    event.preventDefault();
  }

  function pointerMove(event) {
    if (!dragging) {
      return;
    }

    const position = getPosition(event);

    if (dragging === "start") {
      source.selectionStart =
        Math.min(
          position,
          source.selectionEnd - 0.05
        );

      source.selectionStart =
        Math.max(
          0,
          source.selectionStart
        );
    }

    if (dragging === "end") {
      source.selectionEnd =
        Math.max(
          position,
          source.selectionStart + 0.05
        );

      source.selectionEnd =
        Math.min(
          source.buffer.duration,
          source.selectionEnd
        );
    }

    drawEditorWaveform(index);

    event.preventDefault();
  }

  function pointerUp(event) {
    if (!dragging) {
      return;
    }

    dragging = null;

    if (
      canvas.hasPointerCapture(event.pointerId)
    ) {
      canvas.releasePointerCapture(
        event.pointerId
      );
    }

    drawEditorWaveform(index);
  }

  canvas.addEventListener(
    "pointerdown",
    pointerDown
  );

  canvas.addEventListener(
    "pointermove",
    pointerMove
  );

  canvas.addEventListener(
    "pointerup",
    pointerUp
  );

  canvas.addEventListener(
    "pointercancel",
    pointerUp
  );
}

    const songs = [

    let favoritesOnly = false;


    /* =========================

    function isFavorite(songId) {

      return (
        localStorage.getItem(
          "favorite_" + songId
        ) === "true"
      );
    }


    function toggleFavorite(songId) {

      const current = isFavorite(songId);

      localStorage.setItem(
        "favorite_" + songId,
        current ? "false" : "true"
      );

      const button =
        document.getElementById(
          "heart_" + songId
        );

      if (button) {

        const favorite =
          isFavorite(songId);

        button.classList.toggle(
          "active",
          favorite
        );

        button.innerHTML =
          favorite ? "♥" : "♡";

        button.title =
          favorite
            ? "取消收藏"
            : "加入收藏";
      }

      updateStats();

      if (favoritesOnly) {
        renderSongs();
      }
    }


    /* =========================
       下載次數
       ========================= */

    function getDownloadCount(songId) {

      return parseInt(
        localStorage.getItem(
          "downloads_" + songId
        ) || "0"
      );
    }


    /* =========================
       全部音樂
       ========================= */

    function showAllSongs() {

      favoritesOnly = false;

      document
        .getElementById("allTab")
        .classList.add("active");

      document
        .getElementById("favoriteTab")
        .classList.remove("active");

      renderSongs();
    }


    /* =========================
       我的最愛
       ========================= */

    function showFavorites() {

      favoritesOnly = true;

      document
        .getElementById("favoriteTab")
        .classList.add("active");

      document
        .getElementById("allTab")
        .classList.remove("active");

      renderSongs();
    }


    /* =========================
       三點選單
       ========================= */

    function toggleMenu(songId) {

      const target =
        document.getElementById(
          "menu_" + songId
        );

      document
        .querySelectorAll(".song-menu")
        .forEach(menu => {

          if (menu !== target) {
            menu.classList.remove("show");
          }

        });

      if (target) {
        target.classList.toggle("show");
      }
    }


    function closeMenus() {

      document
        .querySelectorAll(".song-menu")
        .forEach(menu => {
          menu.classList.remove("show");
        });
    }


    /* =========================
       分享
       ========================= */

    async function shareSong(songId) {

      const song =
        songs.find(
          item => item.id === songId
        );

      if (!song) {
        alert("找不到這首音樂");
        return;
      }

      closeMenus();

      const shareData = {

        title:
          "自由品勢音樂庫 - " +
          song.title,

        text:
          "自由品勢音樂線上試聽：" +
          song.title,

        url:
          window.location.href
      };


      if (navigator.share) {

        try {

          await navigator.share(
            shareData
          );

          return;

        } catch (error) {

          if (
            error.name === "AbortError"
          ) {
            return;
          }
        }
      }


      try {

        await navigator.clipboard.writeText(
          window.location.href
        );

        alert("連結已複製！");

      } catch (error) {

        const tempInput =
          document.createElement(
            "textarea"
          );

        tempInput.value =
          window.location.href;

        document.body.appendChild(
          tempInput
        );

        tempInput.select();

        document.execCommand(
          "copy"
        );

        document.body.removeChild(
          tempInput
        );

        alert(
          "分享連結已複製！\n可以貼到 LINE、Facebook 或其他地方分享。"
        );
      }
    }


    /* =========================
       下載 MP3
       不要求姓名
       ========================= */

    function downloadMusic(songId) {

      const song =
        songs.find(
          item => item.id === songId
        );

      if (!song) {
        return;
      }

      closeMenus();

      const oldCount =
        getDownloadCount(songId);

      localStorage.setItem(
        "downloads_" + songId,
        oldCount + 1
      );


      const link =
        document.createElement("a");

      link.href =
        song.file;

      link.download =
        song.downloadName;

      document.body.appendChild(
        link
      );

      link.click();

      document.body.removeChild(
        link
      );


      const countElement =
        document.getElementById(
          "downloadCount_" + songId
        );

      if (countElement) {

        countElement.innerHTML =
          "⬇ 已下載 " +
          (oldCount + 1) +
          " 次";
      }

      updateStats();
    }


    /* =========================
       播放 / 暫停
       ========================= */

    function togglePlay(songId) {

      const audio =
        document.getElementById(
          "audio_" + songId
        );

      if (!audio) {
        return;
      }


      document
        .querySelectorAll("audio")
        .forEach(otherAudio => {

          if (
            otherAudio !== audio &&
            !otherAudio.paused
          ) {
            otherAudio.pause();
          }

        });


      if (audio.paused) {

        audio.play();

      } else {

        audio.pause();
      }
    }


    /* =========================
       時間格式
       ========================= */

    function formatTime(seconds) {

      if (
        !isFinite(seconds)
      ) {
        return "0:00";
      }

      const minutes =
        Math.floor(seconds / 60);

      const secs =
        Math.floor(seconds % 60)
          .toString()
          .padStart(2, "0");

      return minutes + ":" + secs;
    }


    /* =========================
       播放器更新
       ========================= */

    function updatePlayer(songId) {

      const audio =
        document.getElementById(
          "audio_" + songId
        );

      const progress =
        document.getElementById(
          "progress_" + songId
        );

      const time =
        document.getElementById(
          "time_" + songId
        );

      if (
        !audio ||
        !progress ||
        !time
      ) {
        return;
      }


      if (
        isFinite(audio.duration) &&
        audio.duration > 0
      ) {

        progress.value =
          (audio.currentTime /
            audio.duration) * 100;

        time.textContent =
          formatTime(audio.currentTime) +
          " / " +
          formatTime(audio.duration);

      } else {

        progress.value = 0;

        time.textContent =
          formatTime(audio.currentTime) +
          " / 1:34";
      }
    }


    /* =========================
       拉動進度
       ========================= */

    function seekSong(songId, value) {

      const audio =
        document.getElementById(
          "audio_" + songId
        );

      if (
        !audio ||
        !isFinite(audio.duration)
      ) {
        return;
      }

      audio.currentTime =
        audio.duration *
        (value / 100);
    }


    /* =========================
       靜音
       ========================= */

    function toggleMute(songId) {

      const audio =
        document.getElementById(
          "audio_" + songId
        );

      const button =
        document.getElementById(
          "volume_" + songId
        );

      if (!audio) {
        return;
      }

      audio.muted =
        !audio.muted;

      if (button) {

        button.innerHTML =
          audio.muted
            ? "🔇"
            : "🔊";
      }
    }


    /* =========================
       顯示歌曲
       ========================= */

    function renderSongs() {

      const musicList =
        document.getElementById(
          "musicList"
        );


      const search =
        document
          .getElementById(
            "searchInput"
          )
          .value
          .trim()
          .toLowerCase();


      const category =
        document
          .getElementById(
            "categorySelect"
          )
          .value;


      const filteredSongs =
        songs.filter(song => {

          const matchSearch =

            song.title
              .toLowerCase()
              .includes(search)

            ||

            song.tags
              .toLowerCase()
              .includes(search);


          const matchCategory =

            category === "全部"

            ||

            song.category === category;


          const matchFavorite =

            !favoritesOnly

            ||

            isFavorite(song.id);


          return (
            matchSearch &&
            matchCategory &&
            matchFavorite
          );

        });


      if (
        filteredSongs.length === 0
      ) {

        musicList.innerHTML = `

          <div class="empty">

            目前沒有符合條件的音樂

          </div>

        `;

        updateStats();

        return;
      }


      musicList.innerHTML =

        filteredSongs
          .map(song => {

            const favorite =
              isFavorite(song.id);

            const downloads =
              getDownloadCount(
                song.id
              );


            return `

              <div class="music-card">

                <h2>
                  ${song.title}
                </h2>


                <div class="info">

                  ${song.duration}

                  <br>

                  ${song.tags}

                </div>


                <div
                  id="downloadCount_${song.id}"
                  class="download-count"
                >

                  ⬇ 已下載
                  ${downloads}
                  次

                </div>


                <audio
                  id="audio_${song.id}"
                  preload="metadata"
                  src="${song.file}"
                  ontimeupdate="
                    updatePlayer(
                      '${song.id}'
                    )
                  "
                  onloadedmetadata="
                    updatePlayer(
                      '${song.id}'
                    )
                  "
                  onplay="
                    updatePlayButton(
                      '${song.id}',
                      true
                    )
                  "
                  onpause="
                    updatePlayButton(
                      '${song.id}',
                      false
                    )
                  "
                  onended="
                    updatePlayButton(
                      '${song.id}',
                      false
                    )
                  "
                ></audio>


                <div class="player-row">


                  <div class="custom-player">


                    <button
                      id="play_${song.id}"
                      class="play-button"
                      onclick="
                        togglePlay(
                          '${song.id}'
                        )
                      "
                      title="播放 / 暫停"
                    >
                      ▶
                    </button>


                    <span
                      id="time_${song.id}"
                      class="time-display"
                    >
                      0:00 / 1:34
                    </span>


                    <input
                      id="progress_${song.id}"
                      class="progress"
                      type="range"
                      min="0"
                      max="100"
                      value="0"
                      step="0.1"
                      oninput="
                        seekSong(
                          '${song.id}',
                          this.value
                        )
                      "
                    >


                    <button
                      id="volume_${song.id}"
                      class="volume-button"
                      onclick="
                        toggleMute(
                          '${song.id}'
                        )
                      "
                      title="靜音 / 開啟聲音"
                    >
                      🔊
                    </button>


                  </div>


                  <button
                    id="heart_${song.id}"
                    class="
                      heart-button
                      ${favorite
                        ? "active"
                        : ""}
                    "
                    onclick="
                      toggleFavorite(
                        '${song.id}'
                      )
                    "
                    title="
                      ${favorite
                        ? "取消收藏"
                        : "加入收藏"}
                    "
                  >
                    ${favorite
                      ? "♥"
                      : "♡"}
                  </button>


                  <div class="menu-wrap">


                    <button
                      class="menu-button"
                      onclick="
                        event.stopPropagation();
                        toggleMenu(
                          '${song.id}'
                        )
                      "
                      title="更多選項"
                    >
                      ⋮
                    </button>


                    <div
                      id="menu_${song.id}"
                      class="song-menu"
                      onclick="
                        event.stopPropagation()
                      "
                    >


                      <button
                        class="menu-item"
                        onclick="
                          shareSong(
                            '${song.id}'
                          )
                        "
                      >
                        ↗ 分享
                      </button>


                      <div
                        class="menu-divider"
                      ></div>


                      <button
                        class="menu-item"
                        onclick="
                          downloadMusic(
                            '${song.id}'
                          )
                        "
                      >
                        ⬇ 下載 MP3
                      </button>


                    </div>


                  </div>


                </div>

              </div>

            `;

          })
          .join("");


      updateStats();
    }


    /* =========================
       播放按鈕 ▶ / ❚❚
       ========================= */

    function updatePlayButton(
      songId,
      playing
    ) {

      document
        .querySelectorAll(
          ".play-button"
        )
        .forEach(button => {

          if (
            button.id !==
            "play_" + songId
          ) {
            button.innerHTML = "▶";
          }

        });


      const button =
        document.getElementById(
          "play_" + songId
        );

      if (button) {

        button.innerHTML =
          playing
            ? "❚❚"
            : "▶";
      }
    }


    /* =========================
       統計
       ========================= */

    function updateStats() {

      let totalDownloads = 0;
      let totalFavorites = 0;


      songs.forEach(song => {

        totalDownloads +=
          getDownloadCount(
            song.id
          );


        if (
          isFavorite(song.id)
        ) {
          totalFavorites++;
        }

      });


      document
        .getElementById(
          "stats"
        )
        .innerHTML =

          "🎵 音樂：" +
          songs.length +
          " 首" +

          "　｜　" +

          "♥ 收藏：" +
          totalFavorites +
          " 首" +

          "　｜　" +

          "⬇ 下載：" +
          totalDownloads +
          " 次";
    }


    /* 點其他地方關閉三點選單 */

    document.addEventListener(
      "click",
      function () {
        closeMenus();
      }
    );


    /* 第一次開啟網頁 */

    renderSongs();

  </script>
