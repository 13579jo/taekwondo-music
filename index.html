<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>自由品勢音樂庫</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #0b0b12;
      color: white;
    }

    .header {
      text-align: center;
      padding: 45px 20px 30px;
      background: linear-gradient(135deg, #101018, #24104d);
    }

    .header h1 {
      margin: 0;
      font-size: 38px;
    }

    .header p {
      margin-top: 12px;
      color: #c9c9d8;
      font-size: 17px;
    }

    .controls {
      width: 90%;
      max-width: 900px;
      margin: 25px auto 10px;
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 10px;
    }

    .search-box,
    .category-select {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: #1c1c27;
      color: white;
      font-size: 16px;
    }

    .tabs {
      width: 90%;
      max-width: 900px;
      margin: 15px auto;
      display: flex;
      gap: 10px;
    }

    .tab-button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: #242432;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .tab-button.active {
      background: #744cff;
    }

    .stats {
      width: 90%;
      max-width: 900px;
      margin: 15px auto 25px;
      color: #b7b7c8;
      font-size: 14px;
    }

    .music-list {
      width: 90%;
      max-width: 900px;
      margin: 0 auto;
    }

    .music-card {
      background: #181821;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 22px;
      box-shadow: 0 0 25px rgba(120, 70, 255, 0.20);
    }

    .music-card h2 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 25px;
    }

    .info {
      color: #bdbdcc;
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 12px;
    }

    .download-count {
      color: #9898aa;
      font-size: 14px;
      margin-bottom: 15px;
    }

    /* =========================
       自製播放器
       ========================= */

    .player-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    .custom-player {
      flex: 1;
      min-width: 0;
      height: 54px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      border-radius: 28px;
      background: #f2f2f2;
      color: #222;
    }

    .play-button {
      border: none;
      background: transparent;
      color: #222;
      width: 32px;
      height: 32px;
      padding: 0;
      font-size: 21px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .time-display {
      color: #555;
      font-size: 14px;
      white-space: nowrap;
      min-width: 82px;
    }

    .progress {
      flex: 1;
      min-width: 40px;
      cursor: pointer;
    }

    .volume-button {
      border: none;
      background: transparent;
      color: #222;
      font-size: 20px;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* 愛心 */

    .heart-button {
      width: 50px;
      height: 50px;
      border: none;
      border-radius: 50%;
      background: #292936;
      color: #b7b7c8;
      font-size: 24px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .heart-button.active {
      color: #ff4f75;
      background: #352b38;
    }

    /* 自訂三點 */

    .menu-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .menu-button {
      width: 50px;
      height: 50px;
      border: none;
      border-radius: 50%;
      background: #292936;
      color: white;
      font-size: 25px;
      cursor: pointer;
    }

    .song-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 58px;
      width: 190px;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.40);
      z-index: 1000;
    }

    .song-menu.show {
      display: block;
    }

    .menu-item {
      width: 100%;
      padding: 15px 18px;
      border: none;
      background: white;
      color: #222;
      text-align: left;
      font-size: 16px;
      cursor: pointer;
    }

    .menu-item:hover {
      background: #eeeeee;
    }

    .menu-divider {
      height: 1px;
      background: #dddddd;
    }

    .empty {
      text-align: center;
      color: #9999aa;
      padding: 50px 20px;
    }

    .footer {
      text-align: center;
      padding: 35px 20px;
      color: #777788;
      font-size: 13px;
    }

    @media (max-width: 650px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 31px;
      }

      .music-card {
        padding: 18px;
      }

      .custom-player {
        gap: 7px;
        padding: 0 10px;
      }

      .time-display {
        min-width: 70px;
        font-size: 12px;
      }

      .heart-button,
      .menu-button {
        width: 46px;
        height: 46px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>自由品勢音樂庫</h1>

    <p>
      高品質剪輯・自由品勢專用・線上試聽・下載使用
    </p>
  </div>


  <!-- 搜尋與分類 -->

  <div class="controls">

    <input
      id="searchInput"
      class="search-box"
      type="text"
      placeholder="🔎 搜尋音樂..."
      oninput="renderSongs()"
    >

    <select
      id="categorySelect"
      class="category-select"
      onchange="renderSongs()"
    >
      <option value="全部">全部分類</option>
      <option value="震撼">震撼</option>
      <option value="東方">東方武術</option>
      <option value="電子">電子</option>
      <option value="優雅">優雅</option>
    </select>

  </div>


  <!-- 全部音樂 / 我的最愛 -->

  <div class="tabs">

    <button
      id="allTab"
      class="tab-button active"
      onclick="showAllSongs()"
    >
      🎵 全部音樂
    </button>

    <button
      id="favoriteTab"
      class="tab-button"
      onclick="showFavorites()"
    >
      ♥ 我的最愛
    </button>

  </div>


  <div id="stats" class="stats"></div>

  <div id="musicList" class="music-list"></div>

  <div class="footer">
    自由品勢音樂庫
  </div>


  <script>

    /* =========================
       音樂資料
       ========================= */

    const songs = [

      {
        id: "music01",

        title: "音樂 01",

        file: "music01.mp3",

        downloadName: "自由品勢音樂01.mp3",

        duration: "94 秒",

        category: "震撼",

        tags: "純音樂 ｜ 震撼卡點 ｜ 自由品勢"
      }

      /*
      以後新增第 2 首，可以在這裡增加：

      ,
      {
        id: "music02",
        title: "音樂 02",
        file: "music02.mp3",
        downloadName: "自由品勢音樂02.mp3",
        duration: "95 秒",
        category: "東方",
        tags: "純音樂 ｜ 東方武術 ｜ 自由品勢"
      }
      */

    ];


    let favoritesOnly = false;


    /* =========================
       收藏
       ========================= */

    function isFavorite(songId) {

      return (
        localStorage.getItem(
          "favorite_" + songId
        ) === "true"
      );
    }


    function toggleFavorite(songId) {

      const current = isFavorite(songId);

      localStorage.setItem(
        "favorite_" + songId,
        current ? "false" : "true"
      );

      const button =
        document.getElementById(
          "heart_" + songId
        );

      if (button) {

        const favorite =
          isFavorite(songId);

        button.classList.toggle(
          "active",
          favorite
        );

        button.innerHTML =
          favorite ? "♥" : "♡";

        button.title =
          favorite
            ? "取消收藏"
            : "加入收藏";
      }

      updateStats();

      if (favoritesOnly) {
        renderSongs();
      }
    }


    /* =========================
       下載次數
       ========================= */

    function getDownloadCount(songId) {

      return parseInt(
        localStorage.getItem(
          "downloads_" + songId
        ) || "0"
      );
    }


    /* =========================
       全部音樂
       ========================= */

    function showAllSongs() {

      favoritesOnly = false;

      document
        .getElementById("allTab")
        .classList.add("active");

      document
        .getElementById("favoriteTab")
        .classList.remove("active");

      renderSongs();
    }


    /* =========================
       我的最愛
       ========================= */

    function showFavorites() {

      favoritesOnly = true;

      document
        .getElementById("favoriteTab")
        .classList.add("active");

      document
        .getElementById("allTab")
        .classList.remove("active");

      renderSongs();
    }


    /* =========================
       三點選單
       ========================= */

    function toggleMenu(songId) {

      const target =
        document.getElementById(
          "menu_" + songId
        );

      document
        .querySelectorAll(".song-menu")
        .forEach(menu => {

          if (menu !== target) {
            menu.classList.remove("show");
          }

        });

      if (target) {
        target.classList.toggle("show");
      }
    }


    function closeMenus() {

      document
        .querySelectorAll(".song-menu")
        .forEach(menu => {
          menu.classList.remove("show");
        });
    }


    /* =========================
       分享
       ========================= */

    async function shareSong(songId) {

      const song =
        songs.find(
          item => item.id === songId
        );

      if (!song) {
        alert("找不到這首音樂");
        return;
      }

      closeMenus();

      const shareData = {

        title:
          "自由品勢音樂庫 - " +
          song.title,

        text:
          "自由品勢音樂線上試聽：" +
          song.title,

        url:
          window.location.href
      };


      if (navigator.share) {

        try {

          await navigator.share(
            shareData
          );

          return;

        } catch (error) {

          if (
            error.name === "AbortError"
          ) {
            return;
          }
        }
      }


      try {

        await navigator.clipboard.writeText(
          window.location.href
        );

        alert("連結已複製！");

      } catch (error) {

        const tempInput =
          document.createElement(
            "textarea"
          );

        tempInput.value =
          window.location.href;

        document.body.appendChild(
          tempInput
        );

        tempInput.select();

        document.execCommand(
          "copy"
        );

        document.body.removeChild(
          tempInput
        );

        alert(
          "分享連結已複製！\n可以貼到 LINE、Facebook 或其他地方分享。"
        );
      }
    }


    /* =========================
       下載 MP3
       不要求姓名
       ========================= */

    function downloadMusic(songId) {

      const song =
        songs.find(
          item => item.id === songId
        );

      if (!song) {
        return;
      }

      closeMenus();

      const oldCount =
        getDownloadCount(songId);

      localStorage.setItem(
        "downloads_" + songId,
        oldCount + 1
      );


      const link =
        document.createElement("a");

      link.href =
        song.file;

      link.download =
        song.downloadName;

      document.body.appendChild(
        link
      );

      link.click();

      document.body.removeChild(
        link
      );


      const countElement =
        document.getElementById(
          "downloadCount_" + songId
        );

      if (countElement) {

        countElement.innerHTML =
          "⬇ 已下載 " +
          (oldCount + 1) +
          " 次";
      }

      updateStats();
    }


    /* =========================
       播放 / 暫停
       ========================= */

    function togglePlay(songId) {

      const audio =
        document.getElementById(
          "audio_" + songId
        );

      if (!audio) {
        return;
      }


      document
        .querySelectorAll("audio")
        .forEach(otherAudio => {

          if (
            otherAudio !== audio &&
            !otherAudio.paused
          ) {
            otherAudio.pause();
          }

        });


      if (audio.paused) {

        audio.play();

      } else {

        audio.pause();
      }
    }


    /* =========================
       時間格式
       ========================= */

    function formatTime(seconds) {

      if (
        !isFinite(seconds)
      ) {
        return "0:00";
      }

      const minutes =
        Math.floor(seconds / 60);

      const secs =
        Math.floor(seconds % 60)
          .toString()
          .padStart(2, "0");

      return minutes + ":" + secs;
    }


    /* =========================
       播放器更新
       ========================= */

    function updatePlayer(songId) {

      const audio =
        document.getElementById(
          "audio_" + songId
        );

      const progress =
        document.getElementById(
          "progress_" + songId
        );

      const time =
        document.getElementById(
          "time_" + songId
        );

      if (
        !audio ||
        !progress ||
        !time
      ) {
        return;
      }


      if (
        isFinite(audio.duration) &&
        audio.duration > 0
      ) {

        progress.value =
          (audio.currentTime /
            audio.duration) * 100;

        time.textContent =
          formatTime(audio.currentTime) +
          " / " +
          formatTime(audio.duration);

      } else {

        progress.value = 0;

        time.textContent =
          formatTime(audio.currentTime) +
          " / 1:34";
      }
    }


    /* =========================
       拉動進度
       ========================= */

    function seekSong(songId, value) {

      const audio =
        document.getElementById(
          "audio_" + songId
        );

      if (
        !audio ||
        !isFinite(audio.duration)
      ) {
        return;
      }

      audio.currentTime =
        audio.duration *
        (value / 100);
    }


    /* =========================
       靜音
       ========================= */

    function toggleMute(songId) {

      const audio =
        document.getElementById(
          "audio_" + songId
        );

      const button =
        document.getElementById(
          "volume_" + songId
        );

      if (!audio) {
        return;
      }

      audio.muted =
        !audio.muted;

      if (button) {

        button.innerHTML =
          audio.muted
            ? "🔇"
            : "🔊";
      }
    }


    /* =========================
       顯示歌曲
       ========================= */

    function renderSongs() {

      const musicList =
        document.getElementById(
          "musicList"
        );


      const search =
        document
          .getElementById(
            "searchInput"
          )
          .value
          .trim()
          .toLowerCase();


      const category =
        document
          .getElementById(
            "categorySelect"
          )
          .value;


      const filteredSongs =
        songs.filter(song => {

          const matchSearch =

            song.title
              .toLowerCase()
              .includes(search)

            ||

            song.tags
              .toLowerCase()
              .includes(search);


          const matchCategory =

            category === "全部"

            ||

            song.category === category;


          const matchFavorite =

            !favoritesOnly

            ||

            isFavorite(song.id);


          return (
            matchSearch &&
            matchCategory &&
            matchFavorite
          );

        });


      if (
        filteredSongs.length === 0
      ) {

        musicList.innerHTML = `

          <div class="empty">

            目前沒有符合條件的音樂

          </div>

        `;

        updateStats();

        return;
      }


      musicList.innerHTML =

        filteredSongs
          .map(song => {

            const favorite =
              isFavorite(song.id);

            const downloads =
              getDownloadCount(
                song.id
              );


            return `

              <div class="music-card">

                <h2>
                  ${song.title}
                </h2>


                <div class="info">

                  ${song.duration}

                  <br>

                  ${song.tags}

                </div>


                <div
                  id="downloadCount_${song.id}"
                  class="download-count"
                >

                  ⬇ 已下載
                  ${downloads}
                  次

                </div>


                <audio
                  id="audio_${song.id}"
                  preload="metadata"
                  src="${song.file}"
                  ontimeupdate="
                    updatePlayer(
                      '${song.id}'
                    )
                  "
                  onloadedmetadata="
                    updatePlayer(
                      '${song.id}'
                    )
                  "
                  onplay="
                    updatePlayButton(
                      '${song.id}',
                      true
                    )
                  "
                  onpause="
                    updatePlayButton(
                      '${song.id}',
                      false
                    )
                  "
                  onended="
                    updatePlayButton(
                      '${song.id}',
                      false
                    )
                  "
                ></audio>


                <div class="player-row">


                  <div class="custom-player">


                    <button
                      id="play_${song.id}"
                      class="play-button"
                      onclick="
                        togglePlay(
                          '${song.id}'
                        )
                      "
                      title="播放 / 暫停"
                    >
                      ▶
                    </button>


                    <span
                      id="time_${song.id}"
                      class="time-display"
                    >
                      0:00 / 1:34
                    </span>


                    <input
                      id="progress_${song.id}"
                      class="progress"
                      type="range"
                      min="0"
                      max="100"
                      value="0"
                      step="0.1"
                      oninput="
                        seekSong(
                          '${song.id}',
                          this.value
                        )
                      "
                    >


                    <button
                      id="volume_${song.id}"
                      class="volume-button"
                      onclick="
                        toggleMute(
                          '${song.id}'
                        )
                      "
                      title="靜音 / 開啟聲音"
                    >
                      🔊
                    </button>


                  </div>


                  <button
                    id="heart_${song.id}"
                    class="
                      heart-button
                      ${favorite
                        ? "active"
                        : ""}
                    "
                    onclick="
                      toggleFavorite(
                        '${song.id}'
                      )
                    "
                    title="
                      ${favorite
                        ? "取消收藏"
                        : "加入收藏"}
                    "
                  >
                    ${favorite
                      ? "♥"
                      : "♡"}
                  </button>


                  <div class="menu-wrap">


                    <button
                      class="menu-button"
                      onclick="
                        event.stopPropagation();
                        toggleMenu(
                          '${song.id}'
                        )
                      "
                      title="更多選項"
                    >
                      ⋮
                    </button>


                    <div
                      id="menu_${song.id}"
                      class="song-menu"
                      onclick="
                        event.stopPropagation()
                      "
                    >


                      <button
                        class="menu-item"
                        onclick="
                          shareSong(
                            '${song.id}'
                          )
                        "
                      >
                        ↗ 分享
                      </button>


                      <div
                        class="menu-divider"
                      ></div>


                      <button
                        class="menu-item"
                        onclick="
                          downloadMusic(
                            '${song.id}'
                          )
                        "
                      >
                        ⬇ 下載 MP3
                      </button>


                    </div>


                  </div>


                </div>

              </div>

            `;

          })
          .join("");


      updateStats();
    }


    /* =========================
       播放按鈕 ▶ / ❚❚
       ========================= */

    function updatePlayButton(
      songId,
      playing
    ) {

      document
        .querySelectorAll(
          ".play-button"
        )
        .forEach(button => {

          if (
            button.id !==
            "play_" + songId
          ) {
            button.innerHTML = "▶";
          }

        });


      const button =
        document.getElementById(
          "play_" + songId
        );

      if (button) {

        button.innerHTML =
          playing
            ? "❚❚"
            : "▶";
      }
    }


    /* =========================
       統計
       ========================= */

    function updateStats() {

      let totalDownloads = 0;
      let totalFavorites = 0;


      songs.forEach(song => {

        totalDownloads +=
          getDownloadCount(
            song.id
          );


        if (
          isFavorite(song.id)
        ) {
          totalFavorites++;
        }

      });


      document
        .getElementById(
          "stats"
        )
        .innerHTML =

          "🎵 音樂：" +
          songs.length +
          " 首" +

          "　｜　" +

          "♥ 收藏：" +
          totalFavorites +
          " 首" +

          "　｜　" +

          "⬇ 下載：" +
          totalDownloads +
          " 次";
    }


    /* 點其他地方關閉三點選單 */

    document.addEventListener(
      "click",
      function () {
        closeMenus();
      }
    );


    /* 第一次開啟網頁 */

    renderSongs();

  </script>

</body>

<!-- ======================================
     自由品勢音樂庫－密碼登入
     ====================================== -->

<div id="loginScreen">

  <div class="loginBox">

    <div class="loginLock">🔒</div>

    <h1>自由品勢音樂庫</h1>

    <p>請輸入密碼進入音樂庫</p>

   <input
  id="sitePassword"
  type="password"
  inputmode="numeric"
  placeholder="請輸入密碼"
  autocomplete="off"
  autocorrect="off"
  autocapitalize="off"
  spellcheck="false"
  data-lpignore="true"
  data-1p-ignore="true"
  name="music-library-access-code"
  onkeydown="if(event.key === 'Enter') checkPassword()"
>

    <button onclick="checkPassword()">
      進入音樂庫
    </button>

    <div id="passwordError"></div>

  </div>

</div>


<style>

#loginScreen {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 99999;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;

  background:
    linear-gradient(
      135deg,
      #0b0b12,
      #24104d
    );
}


.loginBox {
  width: 100%;
  max-width: 380px;

  padding: 35px 25px;

  background: #181821;

  border-radius: 24px;

  text-align: center;

  box-shadow:
    0 0 35px
    rgba(116, 76, 255, 0.30);
}


.loginLock {
  font-size: 48px;
  margin-bottom: 10px;
}

function checkPassword() {

<style>

<div class="simple-editor">

  <h2>✂️ 簡易音樂剪輯</h2>

  <div class="editor-desc">
    選擇兩首音樂，只保留需要的片段，
    再把兩段合成一首新的音樂。
  </div>


  <!-- 第一首 -->
  <div class="editor-song">

    <h3>🎵 第一首音樂</h3>

    <input
      id="fileA"
      class="editor-file"
      type="file"
      accept="audio/*"
    >

    <audio
      id="audioA"
      class="editor-audio"
      controls
    ></audio>

    <div class="editor-time-row">

      <div class="editor-time-box">
        <label>開始時間（秒）</label>

        <input
          id="startA"
          type="number"
          value="0"
          min="0"
          step="0.1"
          oninput="updateEditorDuration()"
        >
      </div>

      <div class="editor-time-box">
        <label>結束時間（秒）</label>

        <input
          id="endA"
          type="number"
          value="0"
          min="0"
          step="0.1"
          oninput="updateEditorDuration()"
        >
      </div>

    </div>

  </div>


  <!-- 第二首 -->
  <div class="editor-song">

    <h3>🎵 第二首音樂</h3>

    <input
      id="fileB"
      class="editor-file"
      type="file"
      accept="audio/*"
    >

    <audio
      id="audioB"
      class="editor-audio"
      controls
    ></audio>

    <div class="editor-time-row">

      <div class="editor-time-box">
        <label>開始時間（秒）</label>

        <input
          id="startB"
          type="number"
          value="0"
          min="0"
          step="0.1"
          oninput="updateEditorDuration()"
        >
      </div>

      <div class="editor-time-box">
        <label>結束時間（秒）</label>

        <input
          id="endB"
          type="number"
          value="0"
          min="0"
          step="0.1"
          oninput="updateEditorDuration()"
        >
      </div>

    </div>

  </div>


  <div
    id="editorDuration"
    class="editor-duration"
  >
    合成後長度：0:00
  </div>


  <div class="editor-buttons">

    <button
      class="editor-btn"
      onclick="createEditedMusic()"
    >
      🎵 產生剪輯音樂
    </button>

    <button
      id="downloadEditedMusic"
      class="editor-btn secondary"
      onclick="downloadEditedMusic()"
      disabled
    >
      ⬇ 下載剪輯音樂
    </button>

  </div>


  <audio
    id="resultAudio"
    controls
  ></audio>

  <div id="editorMessage"></div>

</div>


<script>

  /* =====================================================
     音樂剪輯器 JavaScript
  ===================================================== */

  let decodedA = null;
  let decodedB = null;

  let editedMusicURL = null;


  const editorAudioContext =
    new (
      window.AudioContext ||
      window.webkitAudioContext
    )();


  /* =============================
     選擇第一首音樂
  ============================= */

  document
    .getElementById("fileA")
    .addEventListener(
      "change",
      async function () {

        const file = this.files[0];

        if (!file) return;


        document
          .getElementById("audioA")
          .src =
          URL.createObjectURL(file);


        showEditorMessage(
          "正在讀取第一首音樂..."
        );


        try {

          const buffer =
            await file.arrayBuffer();


          decodedA =
            await editorAudioContext
              .decodeAudioData(buffer);


          document
            .getElementById("endA")
            .value =
            decodedA.duration.toFixed(1);


          updateEditorDuration();


          showEditorMessage(
            "第一首音樂已載入 ✓"
          );


        } catch (error) {

          decodedA = null;

          showEditorMessage(
            "第一首音樂無法讀取，請換另一個音樂檔。"
          );

        }

      }
    );


  /* =============================
     選擇第二首音樂
  ============================= */

  document
    .getElementById("fileB")
    .addEventListener(
      "change",
      async function () {

        const file = this.files[0];

        if (!file) return;


        document
          .getElementById("audioB")
          .src =
          URL.createObjectURL(file);


        showEditorMessage(
          "正在讀取第二首音樂..."
        );


        try {

          const buffer =
            await file.arrayBuffer();


          decodedB =
            await editorAudioContext
              .decodeAudioData(buffer);


          document
            .getElementById("endB")
            .value =
            decodedB.duration.toFixed(1);


          updateEditorDuration();


          showEditorMessage(
            "第二首音樂已載入 ✓"
          );


        } catch (error) {

          decodedB = null;

          showEditorMessage(
            "第二首音樂無法讀取，請換另一個音樂檔。"
          );

        }

      }
    );


  /* =============================
     顯示合成長度
  ============================= */

  function updateEditorDuration() {

    const startA =
      parseFloat(
        document.getElementById("startA").value
      ) || 0;

    const endA =
      parseFloat(
        document.getElementById("endA").value
      ) || 0;


    const startB =
      parseFloat(
        document.getElementById("startB").value
      ) || 0;

    const endB =
      parseFloat(
        document.getElementById("endB").value
      ) || 0;


    const durationA =
      Math.max(
        0,
        endA - startA
      );


    const durationB =
      Math.max(
        0,
        endB - startB
      );


    const total =
      durationA + durationB;


    document
      .getElementById("editorDuration")
      .textContent =
      "合成後長度：" +
      editorFormatTime(total) +
      "（" +
      total.toFixed(1) +
      " 秒）";
  }


  /* =============================
     時間格式
  ============================= */

  function editorFormatTime(seconds) {

    const minutes =
      Math.floor(seconds / 60);

    const secs =
      Math.floor(seconds % 60)
        .toString()
        .padStart(2, "0");


    return minutes + ":" + secs;
  }


  /* =============================
     產生剪輯
  ============================= */

  async function createEditedMusic() {

    if (
      !decodedA ||
      !decodedB
    ) {

      showEditorMessage(
        "請先選擇兩首音樂。"
      );

      return;
    }


    const startA =
      parseFloat(
        document.getElementById("startA").value
      );

    const endA =
      parseFloat(
        document.getElementById("endA").value
      );


    const startB =
      parseFloat(
        document.getElementById("startB").value
      );

    const endB =
      parseFloat(
        document.getElementById("endB").value
      );


    if (
      startA < 0 ||
      endA <= startA ||
      endA > decodedA.duration
    ) {

      showEditorMessage(
        "第一首音樂的開始／結束時間不正確。"
      );

      return;
    }


    if (
      startB < 0 ||
      endB <= startB ||
      endB > decodedB.duration
    ) {

      showEditorMessage(
        "第二首音樂的開始／結束時間不正確。"
      );

      return;
    }


    showEditorMessage(
      "正在產生剪輯音樂..."
    );


    try {

      const sampleRate =
        Math.max(
          decodedA.sampleRate,
          decodedB.sampleRate
        );


      const channels =
        Math.max(
          decodedA.numberOfChannels,
          decodedB.numberOfChannels
        );


      const durationA =
        endA - startA;

      const durationB =
        endB - startB;


      const offline =
        new OfflineAudioContext(
          channels,
          Math.ceil(
            (durationA + durationB) *
            sampleRate
          ),
          sampleRate
        );


      /* 第一首 */

      const sourceA =
        offline.createBufferSource();

      sourceA.buffer =
        decodedA;

      sourceA.connect(
        offline.destination
      );

      sourceA.start(
        0,
        startA,
        durationA
      );


      /* 第二首 */

      const sourceB =
        offline.createBufferSource();

      sourceB.buffer =
        decodedB;

      sourceB.connect(
        offline.destination
      );

      sourceB.start(
        durationA,
        startB,
        durationB
      );


      const rendered =
        await offline.startRendering();


      const wavBlob =
        audioBufferToWav(rendered);


      if (editedMusicURL) {

        URL.revokeObjectURL(
          editedMusicURL
        );

      }


      editedMusicURL =
        URL.createObjectURL(
          wavBlob
        );


      const result =
        document.getElementById(
          "resultAudio"
        );


      result.src =
        editedMusicURL;

      result.style.display =
        "block";


      document
        .getElementById(
          "downloadEditedMusic"
        )
        .disabled = false;


      showEditorMessage(
        "剪輯完成 ✓ 可以先試聽，再下載。"
      );


    } catch (error) {

      console.error(error);

      showEditorMessage(
        "剪輯失敗，請重新選擇音樂再試一次。"
      );

    }

  }


  /* =============================
     下載剪輯結果
  ============================= */

  function downloadEditedMusic() {

    if (!editedMusicURL) {

      showEditorMessage(
        "請先產生剪輯音樂。"
      );

      return;
    }


    const link =
      document.createElement("a");


    link.href =
      editedMusicURL;


    link.download =
      "自由品勢剪輯音樂.wav";


    document.body.appendChild(
      link
    );


    link.click();


    document.body.removeChild(
      link
    );

  }


  /* =============================
     訊息
  ============================= */

  function showEditorMessage(message) {

    document
      .getElementById(
        "editorMessage"
      )
      .textContent =
      message;

  }


  /* =============================
     AudioBuffer → WAV
  ============================= */

  function audioBufferToWav(buffer) {

    const channels =
      buffer.numberOfChannels;

    const sampleRate =
      buffer.sampleRate;

    const length =
      buffer.length;

    const bytesPerSample = 2;

    const blockAlign =
      channels *
      bytesPerSample;


    const arrayBuffer =
      new ArrayBuffer(
        44 +
        length *
        blockAlign
      );


    const view =
      new DataView(
        arrayBuffer
      );


    function writeString(
      offset,
      string
    ) {

      for (
        let i = 0;
        i < string.length;
        i++
      ) {

        view.setUint8(
          offset + i,
          string.charCodeAt(i)
        );

      }

    }


    writeString(
      0,
      "RIFF"
    );


    view.setUint32(
      4,
      36 +
      length *
      blockAlign,
      true
    );


    writeString(
      8,
      "WAVE"
    );


    writeString(
      12,
      "fmt "
    );


    view.setUint32(
      16,
      16,
      true
    );


    view.setUint16(
      20,
      1,
      true
    );


    view.setUint16(
      22,
      channels,
      true
    );


    view.setUint32(
      24,
      sampleRate,
      true
    );


    view.setUint32(
      28,
      sampleRate *
      blockAlign,
      true
    );


    view.setUint16(
      32,
      blockAlign,
      true
    );


    view.setUint16(
      34,
      16,
      true
    );


    writeString(
      36,
      "data"
    );


    view.setUint32(
      40,
      length *
      blockAlign,
      true
    );


    const channelData = [];

    for (
      let channel = 0;
      channel < channels;
      channel++
    ) {

      channelData.push(
        buffer.getChannelData(
          channel
        )
      );

    }


    let offset = 44;


    for (
      let i = 0;
      i < length;
      i++
    ) {

      for (
        let channel = 0;
        channel < channels;
        channel++
      ) {

        const sourceChannel =
          Math.min(
            channel,
            buffer.numberOfChannels - 1
          );


        let sample =
          channelData[sourceChannel][i];


        sample =
          Math.max(
            -1,
            Math.min(
              1,
              sample
            )
          );


        view.setInt16(
          offset,
          sample < 0
            ? sample * 0x8000
            : sample * 0x7FFF,
          true
        );


        offset += 2;

      }

    }


    return new Blob(
      [arrayBuffer],
      {
        type: "audio/wav"
      }
    );

  }

</script>

<!-- ===== 簡易音樂剪輯器結束 ===== -->



 </body>
