<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>自由品勢音樂庫</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #0b0b12;
      color: white;
    }

    .header {
      text-align: center;
      padding: 45px 20px 30px;
      background: linear-gradient(
        135deg,
        #101018,
        #24104d
      );
    }

    .header h1 {
      margin: 0;
      font-size: 38px;
    }

    .header p {
      margin-top: 12px;
      color: #c9c9d8;
      font-size: 17px;
    }

    .controls {
      width: 90%;
      max-width: 900px;
      margin: 25px auto 10px;
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 10px;
    }

    .search-box,
    .category-select {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: #1c1c27;
      color: white;
      font-size: 16px;
    }

    .tabs {
      width: 90%;
      max-width: 900px;
      margin: 15px auto;
      display: flex;
      gap: 10px;
    }

    .tab-button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: #242432;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .tab-button.active {
      background: #744cff;
    }

    .stats {
      width: 90%;
      max-width: 900px;
      margin: 15px auto 25px;
      color: #b7b7c8;
      font-size: 14px;
    }

    .music-list {
      width: 90%;
      max-width: 900px;
      margin: 0 auto;
    }

    .music-card {
      background: #181821;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 22px;

      box-shadow:
        0 0 25px
        rgba(120, 70, 255, 0.20);
    }

    .music-card h2 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 25px;
    }

    .info {
      color: #bdbdcc;
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 8px;
    }

    .download-count {
      color: #9898aa;
      font-size: 14px;
      margin-bottom: 15px;
    }

    /*
      =========================
      播放器區
      =========================
    */

    .player-row {
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    audio {
      flex: 1;
      min-width: 0;
    }

    /*
      愛心
    */

    .heart-button {
      width: 46px;
      height: 46px;

      border: none;
      border-radius: 50%;

      background: #292936;

      color: #ffffff;

      font-size: 25px;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;
    }

    .heart-button.active {
      color: #ff4f75;
      background: #38242c;
    }

    /*
      三個點
    */

    .menu-wrapper {
      position: relative;
      flex-shrink: 0;
    }

    .menu-button {
      width: 46px;
      height: 46px;

      border: none;
      border-radius: 50%;

      background: #292936;

      color: white;

      font-size: 25px;

      cursor: pointer;
    }

    /*
      三點選單
    */

    .more-menu {
      display: none;

      position: absolute;

      right: 0;
      top: 52px;

      width: 170px;

      background: #292936;

      border-radius: 13px;

      overflow: hidden;

      box-shadow:
        0 8px 30px
        rgba(0, 0, 0, 0.45);

      z-index: 100;
    }

    .more-menu.show {
      display: block;
    }

    .menu-item {
      width: 100%;

      padding: 14px 16px;

      border: none;

      background: transparent;

      color: white;

      font-size: 16px;

      text-align: left;

      cursor: pointer;
    }

    .menu-item:hover {
      background: #3b3b4b;
    }

    .menu-divider {
      height: 1px;
      background: #444454;
    }

    .empty {
      text-align: center;
      color: #9999aa;
      padding: 50px 20px;
    }

    .footer {
      text-align: center;
      padding: 35px 20px;
      color: #777788;
      font-size: 13px;
    }

    @media (max-width: 650px) {

      .controls {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 31px;
      }

      .heart-button,
      .menu-button {
        width: 42px;
        height: 42px;
      }
    }

  </style>
</head>


<body>


  <div class="header">

    <h1>
      自由品勢音樂庫
    </h1>

    <p>
      高品質剪輯・自由品勢專用・線上試聽・下載使用
    </p>

  </div>


  <!-- 搜尋 -->

  <div class="controls">

    <input
      id="searchInput"
      class="search-box"
      type="text"
      placeholder="🔎 搜尋音樂..."
      oninput="renderSongs()"
    >

    <select
      id="categorySelect"
      class="category-select"
      onchange="renderSongs()"
    >

      <option value="全部">
        全部分類
      </option>

      <option value="震撼">
        震撼
      </option>

      <option value="東方">
        東方武術
      </option>

      <option value="電子">
        電子
      </option>

      <option value="優雅">
        優雅
      </option>

    </select>

  </div>


  <!-- 分頁 -->

  <div class="tabs">

    <button
      id="allTab"
      class="tab-button active"
      onclick="showAllSongs()"
    >
      🎵 全部音樂
    </button>


    <button
      id="favoriteTab"
      class="tab-button"
      onclick="showFavorites()"
    >
      ♥ 我的最愛
    </button>

  </div>


  <div
    id="stats"
    class="stats"
  ></div>


  <div
    id="musicList"
    class="music-list"
  ></div>


  <div class="footer">
    自由品勢音樂庫
  </div>



<script>

/*
=========================================
音樂資料
=========================================
*/

const songs = [

  {
    id: "music01",

    title: "音樂 01",

    /*
      現在正式使用 MP3
    */

    file: "music01.mp3",

    downloadName:
      "自由品勢音樂01.mp3",

    duration: "94 秒",

    category: "震撼",

    tags:
      "純音樂 ｜ 震撼卡點 ｜ 自由品勢"
  }

];


let favoritesOnly = false;


/*
=========================================
收藏
=========================================
*/

function isFavorite(songId) {

  return (
    localStorage.getItem(
      "favorite_" + songId
    ) === "true"
  );

}


function toggleFavorite(songId) {

  const current =
    isFavorite(songId);


  localStorage.setItem(

    "favorite_" + songId,

    current
      ? "false"
      : "true"

  );


  renderSongs();

}


/*
=========================================
下載次數
=========================================
*/

function getDownloadCount(songId) {

  return parseInt(

    localStorage.getItem(
      "downloads_" + songId
    ) || "0"

  );

}


/*
=========================================
全部音樂
=========================================
*/

function showAllSongs() {

  favoritesOnly = false;


  document
    .getElementById("allTab")
    .classList.add("active");


  document
    .getElementById("favoriteTab")
    .classList.remove("active");


  renderSongs();

}


/*
=========================================
我的最愛
=========================================
*/

function showFavorites() {

  favoritesOnly = true;


  document
    .getElementById("favoriteTab")
    .classList.add("active");


  document
    .getElementById("allTab")
    .classList.remove("active");


  renderSongs();

}


/*
=========================================
三個點選單
=========================================
*/

function toggleMenu(songId, event) {

  event.stopPropagation();


  /*
    先關閉其他選單
  */

  document
    .querySelectorAll(".more-menu")
    .forEach(menu => {

      if (
        menu.id !==
        "menu_" + songId
      ) {

        menu.classList.remove("show");

      }

    });


  const menu =
    document.getElementById(
      "menu_" + songId
    );


  menu.classList.toggle("show");

}


/*
=========================================
分享
=========================================
*/

async function shareSong(songId) {

  closeMenus();


  const song =
    songs.find(
      item => item.id === songId
    );


  if (!song) {

    alert("找不到這首音樂");

    return;

  }


  /*
    分享網站網址
  */

  const shareData = {

    title:
      "自由品勢音樂庫 - " +
      song.title,

    text:
      "自由品勢音樂線上試聽：" +
      song.title,

    url:
      window.location.href

  };


  /*
    手機原生分享
  */

  if (navigator.share) {

    try {

      await navigator.share(
        shareData
      );

      return;

    }

    catch (error) {

      if (
        error.name === "AbortError"
      ) {

        return;

      }

    }

  }


  /*
    電腦沒有原生分享：
    自動複製網址
  */

  try {

    await navigator.clipboard.writeText(
      window.location.href
    );


    alert(
      "分享連結已複製！\n\n" +
      "現在可以直接貼到 LINE、Facebook 或其他地方。"
    );

  }

  catch (error) {


    const tempInput =
      document.createElement(
        "textarea"
      );


    tempInput.value =
      window.location.href;


    document.body.appendChild(
      tempInput
    );


    tempInput.select();


    document.execCommand(
      "copy"
    );


    document.body.removeChild(
      tempInput
    );


    alert(
      "分享連結已複製！"
    );

  }

}


/*
=========================================
下載 MP3
不詢問姓名
直接下載
=========================================
*/

function downloadMusic(songId) {

  closeMenus();


  const song =
    songs.find(
      item => item.id === songId
    );


  if (!song) {

    alert("找不到音樂檔案");

    return;

  }


  /*
    增加本機下載次數
  */

  const oldCount =
    getDownloadCount(songId);


  localStorage.setItem(

    "downloads_" + songId,

    oldCount + 1

  );


  /*
    直接下載 MP3
  */

  const link =
    document.createElement("a");


  link.href =
    song.file;


  link.download =
    song.downloadName;


  document.body.appendChild(
    link
  );


  link.click();


  document.body.removeChild(
    link
  );


  renderSongs();

}


/*
=========================================
關閉所有三點選單
=========================================
*/

function closeMenus() {

  document
    .querySelectorAll(".more-menu")
    .forEach(menu => {

      menu.classList.remove("show");

    });

}


/*
點畫面其他地方，
自動收起三點選單
*/

document.addEventListener(
  "click",
  closeMenus
);


/*
=========================================
顯示歌曲
=========================================
*/

function renderSongs() {

  const musicList =
    document.getElementById(
      "musicList"
    );


  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  const category =
    document
      .getElementById(
        "categorySelect"
      )
      .value;


  const filteredSongs =
    songs.filter(song => {


      const matchSearch =

        song.title
          .toLowerCase()
          .includes(search)

        ||

        song.tags
          .toLowerCase()
          .includes(search);


      const matchCategory =

        category === "全部"

        ||

        song.category === category;


      const matchFavorite =

        !favoritesOnly

        ||

        isFavorite(song.id);


      return (

        matchSearch

        &&

        matchCategory

        &&

        matchFavorite

      );

    });


  /*
    沒有歌曲
  */

  if (
    filteredSongs.length === 0
  ) {

    musicList.innerHTML = `

      <div class="empty">

        目前沒有符合條件的音樂

      </div>

    `;


    updateStats();

    return;

  }


  /*
    建立歌曲卡片
  */

  musicList.innerHTML =

    filteredSongs
      .map(song => {


        const favorite =
          isFavorite(song.id);


        const downloads =
          getDownloadCount(
            song.id
          );


        return `

          <div class="music-card">


            <h2>
              ${song.title}
            </h2>


            <div class="info">

              ${song.duration}

              <br>

              ${song.tags}

            </div>


            <div class="download-count">

              ⬇ 已下載
              ${downloads}
              次

            </div>


            <!--
              播放器 + 愛心 + 三點
            -->

            <div class="player-row">


              <audio controls>

                <source
                  src="${song.file}"
                  type="audio/mpeg"
                >

                您的瀏覽器不支援音樂播放。

              </audio>


              <!-- 愛心 -->

              <button

                class="
                  heart-button
                  ${favorite
                    ? "active"
                    : ""}
                "

                title="收藏"

                onclick="
                  toggleFavorite(
                    '${song.id}'
                  )
                "

              >

                ${
                  favorite
                    ? "♥"
                    : "♡"
                }

              </button>


              <!-- 三個點 -->

              <div
                class="menu-wrapper"
                onclick="event.stopPropagation()"
              >


                <button

                  class="menu-button"

                  title="更多"

                  onclick="
                    toggleMenu(
                      '${song.id}',
                      event
                    )
                  "

                >

                  ⋮

                </button>


                <div

                  id="menu_${song.id}"

                  class="more-menu"

                >


                  <button

                    class="menu-item"

                    onclick="
                      shareSong(
                        '${song.id}'
                      )
                    "

                  >

                    ↗ 分享

                  </button>


                  <div
                    class="menu-divider"
                  ></div>


                  <button

                    class="menu-item"

                    onclick="
                      downloadMusic(
                        '${song.id}'
                      )
                    "

                  >

                    ⬇ 下載 MP3

                  </button>


                </div>


              </div>


            </div>


          </div>

        `;

      })

      .join("");


  updateStats();

}


/*
=========================================
統計
=========================================
*/

function updateStats() {

  let totalDownloads = 0;

  let totalFavorites = 0;


  songs.forEach(song => {


    totalDownloads +=
      getDownloadCount(
        song.id
      );


    if (
      isFavorite(song.id)
    ) {

      totalFavorites++;

    }

  });


  document
    .getElementById(
      "stats"
    )
    .innerHTML =

      "🎵 音樂：" +
      songs.length +
      " 首" +

      "　｜　" +

      "♥ 收藏：" +
      totalFavorites +
      " 首" +

      "　｜　" +

      "⬇ 下載：" +
      totalDownloads +
      " 次";

}


/*
=========================================
第一次開啟網站
=========================================
*/

renderSongs();


</script>


</body>

</html>
