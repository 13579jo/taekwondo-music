<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>自由品勢音樂庫</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #0b0b12;
      color: white;
    }

    .header {
      text-align: center;
      padding: 45px 20px 30px;
      background: linear-gradient(
        135deg,
        #101018,
        #24104d
      );
    }

    .header h1 {
      margin: 0;
      font-size: 38px;
    }

    .header p {
      margin-top: 12px;
      color: #c9c9d8;
      font-size: 17px;
    }

    .controls {
      width: 90%;
      max-width: 900px;
      margin: 25px auto 10px;

      display: grid;

      grid-template-columns:
        1fr 180px;

      gap: 10px;
    }

    .search-box,
    .category-select {

      width: 100%;

      padding: 13px;

      border: none;

      border-radius: 12px;

      background: #1c1c27;

      color: white;

      font-size: 16px;
    }

    .tabs {

      width: 90%;

      max-width: 900px;

      margin: 15px auto;

      display: flex;

      gap: 10px;
    }

    .tab-button {

      flex: 1;

      padding: 12px;

      border: none;

      border-radius: 12px;

      background: #242432;

      color: white;

      font-size: 16px;

      cursor: pointer;
    }

    .tab-button.active {

      background: #744cff;
    }

    .stats {

      width: 90%;

      max-width: 900px;

      margin: 15px auto 25px;

      color: #b7b7c8;

      font-size: 14px;
    }

    .music-list {

      width: 90%;

      max-width: 900px;

      margin: 0 auto;
    }

    .music-card {

      background: #181821;

      border-radius: 20px;

      padding: 24px;

      margin-bottom: 22px;

      box-shadow:
        0 0 25px
        rgba(120, 70, 255, 0.20);
    }

    .music-card h2 {

      margin-top: 0;

      margin-bottom: 8px;

      font-size: 25px;
    }

    .info {

      color: #bdbdcc;

      font-size: 15px;

      line-height: 1.7;

      margin-bottom: 18px;
    }

    .download-count {

      color: #9898aa;

      font-size: 14px;

      margin-bottom: 15px;
    }

    audio {

      width: 100%;

      margin-bottom: 16px;
    }

    .action-row {

      display: flex;

      gap: 10px;

      margin-bottom: 12px;
    }

    .favorite-button,
    .share-button {

      flex: 1;

      padding: 12px;

      border: none;

      border-radius: 12px;

      background: #2b2b38;

      color: white;

      font-size: 16px;

      cursor: pointer;
    }

    .favorite-button.active {

      background: #ff4f75;
    }

    .download-button {

      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 12px;

      background: #744cff;

      color: white;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;
    }

    .download-button:hover {

      background: #8a68ff;
    }

    .empty {

      text-align: center;

      color: #9999aa;

      padding: 50px 20px;
    }

    .footer {

      text-align: center;

      padding: 35px 20px;

      color: #777788;

      font-size: 13px;
    }

    @media (max-width: 650px) {

      .controls {

        grid-template-columns: 1fr;
      }

      .header h1 {

        font-size: 31px;
      }
    }

  </style>

</head>

<body>


  <div class="header">

    <h1>
      自由品勢音樂庫
    </h1>

    <p>
      高品質剪輯・自由品勢專用・線上試聽・下載使用
    </p>

  </div>


  <!-- 搜尋與分類 -->

  <div class="controls">

    <input
      id="searchInput"
      class="search-box"
      type="text"
      placeholder="🔎 搜尋音樂..."
      oninput="renderSongs()"
    >

    <select
      id="categorySelect"
      class="category-select"
      onchange="renderSongs()"
    >

      <option value="全部">
        全部分類
      </option>

      <option value="震撼">
        震撼
      </option>

      <option value="東方">
        東方武術
      </option>

      <option value="電子">
        電子
      </option>

      <option value="優雅">
        優雅
      </option>

    </select>

  </div>


  <!-- 全部音樂 / 我的最愛 -->

  <div class="tabs">

    <button
      id="allTab"
      class="tab-button active"
      onclick="showAllSongs()"
    >
      🎵 全部音樂
    </button>

    <button
      id="favoriteTab"
      class="tab-button"
      onclick="showFavorites()"
    >
      ♥ 我的最愛
    </button>

  </div>


  <div
    id="stats"
    class="stats"
  >
  </div>


  <!-- 音樂列表 -->

  <div
    id="musicList"
    class="music-list"
  >
  </div>


  <div class="footer">

    自由品勢音樂庫

  </div>


  <script>

    /*
      ============================================
      音樂資料
      ============================================

      以後你新增歌曲，
      主要就是在這裡新增一組資料。
    */

    const songs = [

      {
        id: "music01",

        title: "音樂 01",

        file: "music01.aac",

        downloadName:
          "自由品勢音樂01.aac",

        duration: "94 秒",

        category: "震撼",

        tags:
          "純音樂 ｜ 震撼卡點 ｜ 自由品勢"
      }

      /*
      ===============================

      以後有第 2 首時，
      把下面這段打開：

      ,

      {
        id: "music02",

        title: "音樂 02",

        file: "music02.aac",

        downloadName:
          "自由品勢音樂02.aac",

        duration: "95 秒",

        category: "東方",

        tags:
          "純音樂 ｜ 東方武術 ｜ 自由品勢"
      }

      ===============================
      */

    ];


    let favoritesOnly = false;


    /*
      取得收藏狀態
    */

    function isFavorite(songId) {

      return (
        localStorage.getItem(
          "favorite_" + songId
        ) === "true"
      );
    }


    /*
      收藏 / 取消收藏
    */

    function toggleFavorite(songId) {

      const current =
        isFavorite(songId);


      localStorage.setItem(

        "favorite_" + songId,

        current
          ? "false"
          : "true"

      );


      renderSongs();
    }


    /*
      取得下載次數
    */

    function getDownloadCount(songId) {

      return parseInt(

        localStorage.getItem(
          "downloads_" + songId
        ) || "0"

      );
    }


    /*
      全部音樂
    */

    function showAllSongs() {

      favoritesOnly = false;


      document
        .getElementById("allTab")
        .classList.add("active");


      document
        .getElementById("favoriteTab")
        .classList.remove("active");


      renderSongs();
    }


    /*
      我的最愛
    */

    function showFavorites() {

      favoritesOnly = true;


      document
        .getElementById("favoriteTab")
        .classList.add("active");


      document
        .getElementById("allTab")
        .classList.remove("active");


      renderSongs();
    }


    /*
      分享
    */

    async function shareSong(songId) {

      const song =
        songs.find(
          item => item.id === songId
        );


      const shareData = {

        title:
          "自由品勢 " +
          song.title,

        text:
          "自由品勢音樂線上試聽。",

        url:
          window.location.href
      };


      if (navigator.share) {

        try {

          await navigator.share(
            shareData
          );

        }

        catch (error) {

          console.log(
            "取消分享"
          );
        }

      }

      else {

        try {

          await navigator
            .clipboard
            .writeText(
              window.location.href
            );


          alert(
            "網站網址已複製，可以貼到 LINE 或其他地方分享。"
          );

        }

        catch (error) {

          alert(
            "目前無法自動分享，請手動複製網址。"
          );
        }
      }
    }


    /*
      下載音樂
    */

    function downloadMusic(songId) {

      const song =
        songs.find(
          item => item.id === songId
        );


      /*
        增加下載次數
      */

      const oldCount =
        getDownloadCount(songId);


      localStorage.setItem(

        "downloads_" + songId,

        oldCount + 1

      );


      /*
        開始下載
      */

      const link =
        document.createElement("a");


      link.href =
        song.file;


      link.download =
        song.downloadName;


      document.body.appendChild(
        link
      );


      link.click();


      document.body.removeChild(
        link
      );


      /*
        更新畫面
      */

      renderSongs();
    }


    /*
      顯示歌曲
    */

    function renderSongs() {

      const musicList =
        document.getElementById(
          "musicList"
        );


      const search =
        document
          .getElementById(
            "searchInput"
          )
          .value
          .trim()
          .toLowerCase();


      const category =
        document
          .getElementById(
            "categorySelect"
          )
          .value;


      /*
        篩選歌曲
      */

      const filteredSongs =
        songs.filter(song => {


          const matchSearch =

            song.title
              .toLowerCase()
              .includes(search)

            ||

            song.tags
              .toLowerCase()
              .includes(search);


          const matchCategory =

            category === "全部"

            ||

            song.category === category;


          const matchFavorite =

            !favoritesOnly

            ||

            isFavorite(song.id);


          return (

            matchSearch

            &&

            matchCategory

            &&

            matchFavorite

          );

        });


      /*
        沒有歌曲
      */

      if (
        filteredSongs.length === 0
      ) {

        musicList.innerHTML = `

          <div class="empty">

            目前沒有符合條件的音樂

          </div>

        `;

        updateStats();

        return;
      }


      /*
     顯示歌曲
      */

      musicList.innerHTML =

        filteredSongs
          .map(song => {


            const favorite =
              isFavorite(song.id);


            const downloads =
              getDownloadCount(
                song.id
              );


            return `

              <div class="music-card">


                <h2>

                  ${song.title}

                </h2>


                <div class="info">

                  ${song.duration}

                  <br>

                  ${song.tags}

                </div>


                <div
                  class="download-count"
                >

                  ⬇ 已下載
                  ${downloads}
                  次

                </div>


                <audio controls>

                  <source
                    src="${song.file}"
                    type="audio/aac"
                  >

                  您的瀏覽器不支援音樂播放。

                </audio>


                <div class="action-row">


                  <button

                    class="
                      favorite-button
                      ${favorite
                        ? "active"
                        : ""}
                    "

                    onclick="
                      toggleFavorite(
                        '${song.id}'
                      )
                    "

                  >

                    ${
                      favorite
                        ? "♥ 已收藏"
                        : "♡ 我的最愛"
                    }

                  </button>


                  <button

                    class="share-button"

                    onclick="
                      shareSong(
                        '${song.id}'
                      )
                    "

                  >

                    ↗ 分享

                  </button>


                </div>


                <button

                  class="download-button"

                  onclick="
                    downloadMusic(
                      '${song.id}'
                    )
                  "

                >

                  ⬇ 下載

                </button>


              </div>

            `;

          })
          .join("");


      updateStats();

    }


    /*
      顯示統計
    */

    function updateStats() {

      let totalDownloads = 0;

      let totalFavorites = 0;


      songs.forEach(song => {

        totalDownloads +=
          getDownloadCount(
            song.id
          );


        if (
          isFavorite(song.id)
        ) {

          totalFavorites++;
        }

      });


      document
        .getElementById(
          "stats"
        )
        .innerHTML =

          "🎵 音樂：" +
          songs.length +
          " 首" +

          "　｜　" +

          "♥ 收藏：" +
          totalFavorites +
          " 首" +

          "　｜　" +

          "⬇ 下載：" +
          totalDownloads +
          " 次";

    }


    /*
      網頁第一次開啟
    */

    renderSongs();

  </script>


</body>

</html>
