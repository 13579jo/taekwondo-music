<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <!-- ==========================================
       【開始】01-01 網頁基本設定

       【作用】
       設定中文網頁、手機比例、網站名稱
  ========================================== -->

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>自由品勢音樂庫</title>

  <!-- ==========================================
       【結束】01-01 網頁基本設定
  ========================================== -->


  <!-- ==========================================
       【開始】01-02 網站外觀

       【作用】
       設定：
       1. 深色背景
       2. 紫色漸層標題區
       3. 手機與電腦顯示比例
       4. 搜尋框
       5. 分類選單
       6. 功能按鈕
  ========================================== -->

  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;

      font-family:
        Arial,
        "Microsoft JhengHei",
        sans-serif;

      background: #0b0b12;

      color: white;
    }


    /* ---------- 最上方標題 ---------- */

    .header {

      width: 100%;

      text-align: center;

      padding:
        45px
        20px
        30px;

      background:
        linear-gradient(
          135deg,
          #101018,
          #24104d
        );
    }


    .header h1 {

      margin: 0;

      font-size: 38px;

      font-weight: bold;
    }


    .header p {

      margin:
        12px
        0
        0;

      color: #c9c9d8;

      font-size: 17px;
    }


    /* ---------- 主要內容 ---------- */

    .main {

      width: 90%;

      max-width: 900px;

      margin: auto;

      padding:
        30px
        0
        60px;
    }


    /* ---------- 搜尋框 ---------- */

    .search-box {

      width: 100%;

      padding: 15px 18px;

      border: 1px solid #353545;

      border-radius: 12px;

      outline: none;

      background: #171720;

      color: white;

      font-size: 16px;
    }


    .search-box::placeholder {

      color: #888899;
    }


    /* ---------- 分類 ---------- */

    .category-box {

      width: 100%;

      margin-top: 15px;

      padding: 14px 16px;

      border: 1px solid #353545;

      border-radius: 12px;

      background: #171720;

      color: white;

      font-size: 16px;

      outline: none;
    }


    /* ---------- 功能按鈕 ---------- */

    .tabs {

      display: flex;

      gap: 10px;

      margin-top: 20px;
    }


    .tab-button {

      flex: 1;

      min-height: 48px;

      border: 1px solid #39394a;

      border-radius: 12px;

      background: #181820;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;
    }


    .tab-button.active {

      background: #6c45e8;

      border-color: #6c45e8;
    }


    /* ---------- 內容區 ---------- */

    .content-area {

      margin-top: 25px;

      min-height: 250px;

      padding: 25px;

      border: 1px solid #292934;

      border-radius: 16px;

      background: #111118;

      text-align: center;
    }


    .content-area h2 {

      margin-top: 0;

      font-size: 22px;
    }


    .content-area p {

      color: #9999aa;

      line-height: 1.7;
    }


    /* ==========================================
       手機版
    ========================================== */

    @media (max-width: 650px) {

      .header {

        padding:
          35px
          15px
          25px;
      }


      .header h1 {

        font-size: 30px;
      }


      .header p {

        font-size: 14px;
      }


      .main {

        width: 92%;

        padding-top: 20px;
      }


      .tabs {

        gap: 7px;
      }


      .tab-button {

        font-size: 14px;

        padding:
          10px
          5px;
      }


      .content-area {

        padding:
          20px
          15px;
      }

    }

  </style>

  <!-- ==========================================
       【結束】01-02 網站外觀
  ========================================== -->

</head>


<body>


  <!-- ==========================================
       【開始】01-03 網站標題

       【作用】
       顯示網站名稱與網站說明
  ========================================== -->

  <header class="header">

    <h1>
      自由品勢音樂庫
    </h1>

    <p>
      自由品勢音樂線上試聽
    </p>

  </header>

  <!-- ==========================================
       【結束】01-03 網站標題
  ========================================== -->



  <!-- ==========================================
       【開始】01-04 首頁主要內容

       【作用】
       放搜尋、分類、功能入口與內容
  ========================================== -->

  <main class="main">


    <!-- ========================================
         【開始】搜尋框
         【作用】之後用來搜尋歌曲
    ========================================= -->

    <input
      id="searchInput"
      class="search-box"
      type="text"
      placeholder="🔍 搜尋音樂..."
    >

    <!-- ========================================
         【結束】搜尋框
    ========================================= -->



    <!-- ========================================
         【開始】分類選單

         【作用】
         之後可以依音樂類型篩選歌曲
    ========================================= -->

    <select
      id="categorySelect"
      class="category-box"
    >

      <option value="全部">
        全部分類
      </option>

      <option value="震撼">
        震撼
      </option>

      <option value="東方武術">
        東方武術
      </option>

      <option value="電子">
        電子
      </option>

      <option value="優雅">
        優雅
      </option>

    </select>

    <!-- ========================================
         【結束】分類選單
    ========================================= -->



    <!-- ========================================
         【開始】功能入口

         【作用】
         切換：
         1. 全部音樂
         2. 我的最愛
         3. 音樂剪輯
    ========================================= -->

    <div class="tabs">

      <button
        id="allMusicButton"
        class="tab-button active"
        type="button"
      >
        🎵 全部音樂
      </button>


      <button
        id="favoriteButton"
        class="tab-button"
        type="button"
      >
        ♥ 我的最愛
      </button>


      <button
        id="editorButton"
        class="tab-button"
        type="button"
      >
        ✂️ 音樂剪輯
      </button>

    </div>

    <!-- ========================================
         【結束】功能入口
    ========================================= -->



    <!-- ========================================
         【開始】主要顯示區

         【作用】
         之後播放器、歌曲列表、
         我的最愛、剪輯器
         都會顯示在這個區域
    ========================================= -->

    <section
      id="contentArea"
      class="content-area"
    >

      <h2>
        🎵 全部音樂
      </h2>

      <p>
        音樂列表之後會顯示在這裡
      </p>

    </section>

    <!-- ========================================
         【結束】主要顯示區
    ========================================= -->


  </main>

  <!-- ==========================================
       【結束】01-04 首頁主要內容
  ========================================== -->



  <!-- ==========================================
       【開始】01-05 首頁基本操作

       【作用】
       讓三個功能按鈕可以先切換畫面。

       注意：
       目前只是建立基本切換，
       真正播放器、收藏、剪輯功能
       後面再一個一個加入。
  ========================================== -->

  <script>

    const allMusicButton =
      document.getElementById("allMusicButton");

    const favoriteButton =
      document.getElementById("favoriteButton");

    const editorButton =
      document.getElementById("editorButton");

    const contentArea =
      document.getElementById("contentArea");


    function clearActiveButton() {

      allMusicButton.classList.remove("active");

      favoriteButton.classList.remove("active");

      editorButton.classList.remove("active");

    }


    /* ========================================
       【開始】全部音樂按鈕
       【作用】顯示全部音樂區
    ========================================= */

    allMusicButton.addEventListener(
      "click",
      function () {

        clearActiveButton();

        allMusicButton.classList.add("active");

        contentArea.innerHTML = `
          <h2>🎵 全部音樂</h2>

          <p>
            音樂列表之後會顯示在這裡
          </p>
        `;

      }
    );

    /* ========================================
       【結束】全部音樂按鈕
    ========================================= */



    /* ========================================
       【開始】我的最愛按鈕
       【作用】切換到收藏歌曲區
    ========================================= */

    favoriteButton.addEventListener(
      "click",
      function () {

        clearActiveButton();

        favoriteButton.classList.add("active");

        contentArea.innerHTML = `
          <h2>♥ 我的最愛</h2>

          <p>
            收藏的歌曲之後會顯示在這裡
          </p>
        `;

      }
    );

    /* ========================================
       【結束】我的最愛按鈕
    ========================================= */



    /* ========================================
       【開始】音樂剪輯按鈕
       【作用】切換到音樂剪輯工作室
    ========================================= */

    editorButton.addEventListener(
      "click",
      function () {

        clearActiveButton();

        editorButton.classList.add("active");

        contentArea.innerHTML = `
          <h2>✂️ 音樂剪輯工作室</h2>

          <p>
            音樂剪輯器之後會建立在這裡
          </p>
        `;

      }
    );

    /* ========================================
       【結束】音樂剪輯按鈕
    ========================================= */


  </script>

  <!-- ==========================================
       【結束】01-05 首頁基本操作
  ========================================== -->


</body>

<!-- ==========================================
     【開始】音樂01

     【作用】
     載入 GitHub 裡面的 music01.mp3

     現在只負責載入音樂，
     還不做播放器外觀。
========================================== -->

<audio
  id="music01"
  src="music01.mp3"
  preload="metadata">
</audio>

<!-- ==========================================
     【結束】音樂01
========================================== -->






  
</html>
