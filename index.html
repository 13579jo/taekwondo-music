<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>自由品勢音樂庫</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #0b0b12;
      color: white;
    }

    .header {
      text-align: center;
      padding: 45px 20px 30px;
      background: linear-gradient(135deg, #101018, #24104d);
    }

    .header h1 {
      margin: 0;
      font-size: 38px;
    }

    .header p {
      margin-top: 12px;
      color: #c9c9d8;
      font-size: 17px;
    }

    .controls {
      width: 90%;
      max-width: 900px;
      margin: 25px auto 10px;
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 10px;
    }

    .search-box,
    .category-select {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: #1c1c27;
      color: white;
      font-size: 16px;
    }

    .tabs {
      width: 90%;
      max-width: 900px;
      margin: 15px auto;
      display: flex;
      gap: 10px;
    }

    .tab-button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: #242432;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .tab-button.active {
      background: #744cff;
    }

    .main-nav {
      flex-wrap: wrap;
    }
    .main-nav .tab-button {
      flex: 1 1 135px;
      min-height: 48px;
    }
    .feature-panel {
      width: 90%;
      max-width: 900px;
      margin: 18px auto;
      background: #181821;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 0 25px rgba(120,70,255,.16);
    }
    .feature-panel h2 { margin: 0 0 10px; }
    .feature-panel p { color:#bdbdcc; line-height:1.7; }
    .feature-empty { padding:28px 10px; text-align:center; color:#9999aa; }

    .stats {
      width: 90%;
      max-width: 900px;
      margin: 15px auto 25px;
      color: #b7b7c8;
      font-size: 14px;
    }

    .music-list {
      width: 90%;
      max-width: 900px;
      margin: 0 auto;
    }

    .music-card {
      background: #181821;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 22px;
      box-shadow: 0 0 25px rgba(120, 70, 255, 0.20);
    }

    .music-card h2 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 25px;
    }

    .info {
      color: #bdbdcc;
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 12px;
    }

    .download-count {
      color: #9898aa;
      font-size: 14px;
      margin-bottom: 15px;
    }

    /* =========================
       自製播放器
       ========================= */

    .player-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    .custom-player {
      flex: 1;
      min-width: 0;
      height: 54px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      border-radius: 28px;
      background: #f2f2f2;
      color: #222;
    }

    .play-button {
      border: none;
      background: transparent;
      color: #222;
      width: 32px;
      height: 32px;
      padding: 0;
      font-size: 21px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .time-display {
      color: #555;
      font-size: 14px;
      white-space: nowrap;
      min-width: 82px;
    }

    .progress {
      flex: 1;
      min-width: 40px;
      cursor: pointer;
    }

    .volume-button {
      border: none;
      background: transparent;
      color: #222;
      font-size: 20px;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* 愛心 */

    .heart-button {
      width: 50px;
      height: 50px;
      border: none;
      border-radius: 50%;
      background: #292936;
      color: #b7b7c8;
      font-size: 24px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .heart-button.active {
      color: #ff4f75;
      background: #352b38;
    }

    /* 自訂三點 */

    .menu-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .menu-button {
      width: 50px;
      height: 50px;
      border: none;
      border-radius: 50%;
      background: #292936;
      color: white;
      font-size: 25px;
      cursor: pointer;
    }

    .song-menu {
      display: none;
      position: absolute;
      right: 0;
      top: 58px;
      width: 190px;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.40);
      z-index: 1000;
    }

    .song-menu.show {
      display: block;
    }

    .menu-item {
      width: 100%;
      padding: 15px 18px;
      border: none;
      background: white;
      color: #222;
      text-align: left;
      font-size: 16px;
      cursor: pointer;
    }

    .menu-item:hover {
      background: #eeeeee;
    }

    .menu-divider {
      height: 1px;
      background: #dddddd;
    }

    .empty {
      text-align: center;
      color: #9999aa;
      padding: 50px 20px;
    }

    .footer {
      text-align: center;
      padding: 35px 20px;
      color: #777788;
      font-size: 13px;
    }

    @media (max-width: 650px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .header h1 {
        font-size: 31px;
      }

      .music-card {
        padding: 18px;
      }

      .custom-player {
        gap: 7px;
        padding: 0 10px;
      }

      .time-display {
        min-width: 70px;
        font-size: 12px;
      }

      .heart-button,
      .menu-button {
        width: 46px;
        height: 46px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
     01｜網站標題區
     作用：顯示網站名稱與說明
========================= -->
<div class="header">
    <h1>自由品勢音樂庫</h1>

    <p>
      高品質剪輯・自由品勢專用・線上試聽・下載使用
    </p>
  </div>


  <!-- =========================
     02｜搜尋與分類
     作用：搜尋歌曲、切換分類、進入音樂剪輯
========================= -->

  <div class="controls">

    <input
      id="searchInput"
      class="search-box"
      type="text"
      placeholder="🔎 搜尋音樂..."
      oninput="renderSongs()"

    <select
      id="categorySelect"
      class="category-select"
      onchange="handleCategoryChange()"

      <option value="全部">全部分類</option>
      <option value="震撼">震撼</option>
      <option value="東方">東方武術</option>
      <option value="電子">電子</option>
      <option value="優雅">優雅</option>
      <option value="剪輯">✂️ 音樂剪輯</option>
    </select>

  </div>


  <!-- =========================
     03｜全部音樂 / 我的最愛
     作用：切換全部歌曲與收藏歌曲
========================= -->

  <div class="tabs main-nav">
    <button id="homeTab" class="tab-button active" onclick="showHomePage()">🏠 回主頁</button>
    <button id="uploadTab" class="tab-button" onclick="openLibraryUpload()">⬆️ 上傳音樂</button>
    <button id="favoriteTab" class="tab-button" onclick="showFavorites()">♥ 我的最愛</button>
    <button id="editTab" class="tab-button" onclick="openEditorFromNav()">✂️ 剪輯音樂</button>
    <button id="worksTab" class="tab-button" onclick="showFinishedWorks()">🎵 我的剪輯作品</button>
    <button id="packagesTab" class="tab-button" onclick="showWorkPackages()">📂 工作包</button>
    <input id="libraryUploadInput" type="file" accept="audio/*" multiple hidden onchange="handleLibraryUpload(this.files);this.value=''">
  </div>


  <div id="stats" class="stats"></div>

  <div id="musicList" class="music-list"></div>

  <div class="footer">
    自由品勢音樂庫
  </div>


  <script>

/* ============================================================
   【功能 01】影片式多軌音樂剪輯工作室
   作用：中央固定播放線、橫向時間軸、真正分割、刪除、拖動片段、多軌音樂/音效。
============================================================ */
let editorAudioContext=null, editorSources=[], timelineClips=[], selectedClipId=null;
let trackAudioStates={}; // 每條音軌只保留 mute：false=有聲、true=靜音
let editorPlaying=false, editorNodes=[], editorStartedAt=0, editorAnimationId=null, editorPlayhead=0;
let historyStack=[], redoStack=[], pixelsPerSecond=10, draggingTimeline=false, dragStartX=0, dragStartTime=0;
const TRACK_HEIGHT=82, RULER_HEIGHT=34;
const TRACK_LABEL_WIDTH=window.innerWidth<650?72:96;
let fitDuration=95;

function setEditorOnlyUI(isEditor){
  const search=document.getElementById('searchInput');
  if(search) search.style.display=isEditor?'none':'';
}
function handleCategoryChange(){
  const category=document.getElementById('categorySelect').value;
  if(category==='剪輯'){
    setEditorOnlyUI(true);
    showMusicEditor();
  } else {
    setEditorOnlyUI(false);
    const editor=document.getElementById('musicEditor'); if(editor) editor.style.display='none';
    document.getElementById('musicList').style.display=''; document.getElementById('stats').style.display=''; renderSongs();
  }
}
function showMusicEditor(){
  document.getElementById('musicList').style.display='none'; document.getElementById('stats').style.display='none';
  let editor=document.getElementById('musicEditor');
  if(!editor){
    editor=document.createElement('div'); editor.id='musicEditor'; editor.className='music-list';
    editor.innerHTML=`<div class="music-card editor-card">
      <h2 style="text-align:center;margin-bottom:6px">✂️ 音樂剪輯工作室</h2>
      <div class="info" style="text-align:center">整首音樂滿版顯示｜點時間位置移動播放線｜選取片段後按「分割」</div>
      <input id="musicFileInput" type="file" accept="audio/*" multiple hidden>
      <input id="effectFileInput" type="file" accept="audio/*" multiple hidden>
      <div class="editor-topbar">
        <div class="editor-tool-row">
          <button class="ed-btn primary" onclick="document.getElementById('musicFileInput').click()">＋ 音樂</button>
          <button class="ed-btn" onclick="document.getElementById('effectFileInput').click()">⚡ 音效</button>
          <button class="ed-btn" onclick="splitSelectedClip()">✂️ 分割</button>
          <button class="ed-btn" onclick="deleteSelectedClip()">🗑 刪除</button>
        </div>
        <div class="editor-tool-row">
          <button class="ed-btn" onclick="undoEditor()">↶ 復原</button>
          <button class="ed-btn" onclick="redoEditor()">↷ 重做</button>
          <button class="ed-btn primary" onclick="exportFinishedSong()">✅ 剪輯完成</button>
          <button class="ed-btn" onclick="document.getElementById('projectFileInput').click()">📂 開啟工作包</button>
        </div>
        <input id="projectFileInput" type="file" accept=".zip,application/zip" style="display:none" onchange="openWorkPackage(this.files[0]);this.value=''">
      </div>
      <div class="transport">
        <button id="timelinePlayBtn" class="round-play" onclick="toggleTimelinePlay()">▶</button>
        <div id="editorTimeText" class="big-time">00:00.0 / 00:00.0</div>
      </div>
      <div id="timelineViewport" class="timeline-viewport">
        <div id="timelineStage" class="timeline-stage">
          <div id="timeRuler" class="time-ruler"></div>
          <div id="tracksArea" class="tracks-area"></div>
        </div>
        <div class="fixed-playhead"><div class="playhead-cap"></div></div>
      </div>
      <div id="timelineStatus" class="timeline-status">目標長度：01:34～01:35 ｜目前：00:00.0</div>

      <div id="finishedSongArea" class="finished-song-area" style="display:none">
        <div class="finished-song-title">🎵 剪輯完成</div>
        <div class="finished-song-note">先試聽完整成品，確認沒問題後再下載工作包。</div>
        <audio id="finishedSongPlayer" preload="metadata"></audio>
        <div class="finished-custom-player">
          <button id="finishedPlayBtn" type="button" onclick="toggleFinishedPlay()">▶</button>
          <span id="finishedCurrentTime">00:00</span>
          <input id="finishedSeek" type="range" min="0" max="1000" value="0" oninput="seekFinishedSong(this.value)">
          <span id="finishedDuration">00:00</span>
          <span class="finished-volume-icon">🔊</span>
          <input id="finishedVolume" type="range" min="0" max="1" step="0.05" value="1" oninput="setFinishedVolume(this.value)">
        </div>
        <button id="finishedSongDownload" type="button" class="finished-download" onclick="downloadWorkPackage()">⬇️ 下載完整版／工作包</button>
      </div>
    </div>`;
    document.getElementById('musicList').insertAdjacentElement('afterend',editor);
    installEditorStyles(); installTimelineGestures();
  }
  editor.style.display=''; renderTimeline();
}
function installEditorStyles(){ if(document.getElementById('editorStyles'))return; const s=document.createElement('style'); s.id='editorStyles'; s.textContent=`
.editor-card{padding:16px!important;overflow:hidden}.editor-topbar{display:flex;flex-wrap:nowrap;gap:7px;overflow-x:auto;overflow-y:hidden;padding:8px 0 12px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}.editor-topbar .ed-btn{flex:0 0 auto}.editor-topbar{flex-direction:column!important;overflow:visible!important}.editor-tool-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;width:100%}.editor-tool-row .ed-btn{width:100%;min-width:0}@media(max-width:650px){.editor-tool-row{gap:5px}.editor-tool-row .ed-btn{font-size:12px;padding:9px 3px}}.ed-btn{border:0;border-radius:9px;background:#30303d;color:#fff;padding:10px 13px;white-space:nowrap;font-weight:700}.ed-btn.primary{background:#744cff}.transport{display:flex;justify-content:center;align-items:center;gap:14px;padding:8px 0 13px}.round-play{width:46px;height:46px;border-radius:50%;border:0;background:#fff;color:#111;font-size:20px}.big-time{font-variant-numeric:tabular-nums;font-weight:800;font-size:17px}.timeline-viewport{height:390px;position:relative;overflow:hidden;background:#09090e;border-radius:12px;border:1px solid #292936;touch-action:none;user-select:none}.timeline-stage{position:absolute;inset:0;height:100%;width:100%}.time-ruler{position:absolute;top:0;left:0;right:0;height:34px;border-bottom:1px solid #343440;background:#111118}.tracks-area{position:absolute;top:34px;left:0;right:0}.track-row{position:absolute;left:0;height:76px;border-bottom:1px solid #262632}.track-label{position:absolute;left:0;z-index:8;width:${TRACK_LABEL_WIDTH}px;height:100%;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:6px;color:#aaa;background:linear-gradient(90deg,#0d0d13 88%,transparent);font-size:11px}.track-name{white-space:nowrap}.track-audio-buttons{display:flex;gap:4px}.track-audio-btn{border:1px solid #444;border-radius:6px;background:#24242e;color:#fff;padding:3px 5px;font-size:10px;line-height:1.2}.track-audio-btn.active{background:#744cff;border-color:#9b83ff}.clip{position:absolute;top:7px;height:62px;border:2px solid #6d5ce7;border-radius:7px;background:#29204a;overflow:hidden;touch-action:none}.clip.selected{border-color:#fff;box-shadow:0 0 0 1px #fff}.clip.effect{background:#49341f;border-color:#ffb020}.clip-title{height:20px;padding:3px 7px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.clip canvas{display:block;width:100%;height:38px}.trim-handle{position:absolute;top:0;bottom:0;width:14px;z-index:15;display:none;cursor:ew-resize;touch-action:none;background:rgba(255,255,255,.16)}.clip.selected .trim-handle{display:block}.trim-handle.left{left:0;border-left:4px solid #fff}.trim-handle.right{right:0;border-right:4px solid #fff}.trim-handle:before{content:"";position:absolute;top:20px;width:3px;height:20px;border-radius:3px;background:#fff}.trim-handle.left:before{left:4px}.trim-handle.right:before{right:4px}.trim-time{position:fixed;z-index:99999;display:none;padding:7px 10px;border-radius:8px;background:#fff;color:#111;font-weight:800;font-size:14px;pointer-events:none;box-shadow:0 4px 18px rgba(0,0,0,.45)}.track-audio-btn.muted{background:#d60000!important;border:2px solid #ff5a5a!important;color:#fff!important;font-size:12px!important;font-weight:900!important;min-width:48px;min-height:30px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px rgba(255,0,0,.18)}.fixed-playhead{position:absolute;top:0;bottom:0;left:${TRACK_LABEL_WIDTH}px;width:2px;background:#fff;z-index:30;pointer-events:none;box-shadow:0 0 4px #000}.playhead-cap{position:absolute;top:0;left:-6px;width:14px;height:14px;background:#fff;border-radius:2px 2px 8px 8px}.timeline-status{text-align:center;color:#aaa;font-size:13px;padding:10px}.bottom-tools{display:flex;justify-content:space-around;gap:5px;border-top:1px solid #30303b;padding-top:10px}.tool-btn{flex:1;min-width:58px;border:0;background:transparent;color:#fff;font-size:21px;padding:6px 2px}.tool-btn span{display:block;font-size:11px;margin-top:4px}.editor-help{color:#8f8fa2;font-size:12px;text-align:center;margin-top:10px;line-height:1.6}.finished-song-area{margin-top:14px;padding:16px;border:1px solid #383848;border-radius:12px;background:#15151d;text-align:center}.finished-song-title{font-size:20px;font-weight:900;margin-bottom:5px}.finished-song-note{font-size:12px;color:#aaa;margin-bottom:12px}.finished-song-area audio{display:block;width:100%;margin:0 auto 12px}.finished-download{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:10px;background:#744cff;color:#fff;text-decoration:none;font-weight:900}.finished-download:hover{filter:brightness(1.08)}.finished-custom-player{display:flex;align-items:center;gap:8px;width:100%;margin:0 auto 12px;padding:10px;border-radius:10px;background:#20202a}.finished-custom-player button{width:38px;height:38px;flex:0 0 38px;border:0;border-radius:50%;background:#fff;color:#111;font-size:16px;font-weight:900}.finished-custom-player span{font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}.finished-custom-player #finishedSeek{flex:1;min-width:60px}.finished-custom-player #finishedVolume{width:78px}.finished-download{border:0;cursor:pointer}@media(max-width:650px){.finished-volume-icon,#finishedVolume{display:none}}.tick{position:absolute;top:0;height:100%;border-left:1px solid #4a4a55;color:#aaa;font-size:10px;padding-left:3px}.tick.minor{height:10px;color:transparent;border-color:#30303a}.empty-track{position:absolute;left:100px;top:20px;color:#666;font-size:13px}@media(max-width:650px){.music-list{width:100%}.editor-card{border-radius:0!important;padding:10px!important}.timeline-viewport{height:360px}.ed-btn{padding:9px 11px}.big-time{font-size:15px}.tool-btn{font-size:19px}}
`; document.head.appendChild(s); }
function snapshot(){ historyStack.push(JSON.stringify(timelineClips)); if(historyStack.length>40)historyStack.shift(); redoStack=[]; }
function undoEditor(){ if(!historyStack.length)return; stopTimeline(); redoStack.push(JSON.stringify(timelineClips)); timelineClips=JSON.parse(historyStack.pop()); selectedClipId=null; renderTimeline(); }
function redoEditor(){ if(!redoStack.length)return; stopTimeline(); historyStack.push(JSON.stringify(timelineClips)); timelineClips=JSON.parse(redoStack.pop()); selectedClipId=null; renderTimeline(); }

document.addEventListener('change',async e=>{
  if(!['musicFileInput','effectFileInput'].includes(e.target.id))return;
  const isEffect=e.target.id==='effectFileInput';
  const files=[...(e.target.files||[])];
  if(!files.length)return;
  if(!editorAudioContext)editorAudioContext=new(window.AudioContext||window.webkitAudioContext)();
  snapshot();
  for(const file of files){
    try{
      const buffer=await editorAudioContext.decodeAudioData(await file.arrayBuffer());
      const sourceIndex=editorSources.length;
      editorSources.push({file,buffer,isEffect});
      // 每一首新音樂固定建立自己的獨立音軌；音效也建立獨立音軌。
      const track=nextFreeTrack();
      // 新加入的完整歌曲從 0:00 顯示，整首直接看得到，不塞到上一首歌後面。
      timelineClips.push(newClip(sourceIndex,0,buffer.duration,0,track,isEffect));
    }catch(err){
      console.error(err);
      alert('無法讀取：'+file.name+'\n建議使用 MP3、WAV 或 M4A。');
    }
  }
  e.target.value='';
  editorPlayhead=0;
  renderTimeline();
});
function nextFreeTrack(){
  const used=new Set(timelineClips.map(c=>Number(c.track)||0));
  let t=0; while(used.has(t))t++; return t;
}
function newClip(sourceIndex,start,end,timelineStart,track,isEffect=false){return{id:'clip_'+Date.now()+'_'+Math.random().toString(36).slice(2),sourceIndex,start,end,timelineStart,track,isEffect};}
function clipDuration(c){return Math.max(0,c.end-c.start)} function clipEnd(c){return c.timelineStart+clipDuration(c)}
function getTrackAudioState(track){if(!trackAudioStates[track])trackAudioStates[track]={mute:false};return trackAudioStates[track];}
function updateTrackMuteButton(track){
  const btn = document.getElementById('trackMuteBtn_' + track);
  if (!btn) return;

  const state = getTrackAudioState(track);
  const muted = !!state.mute;

  // 完整狀態文字 + 直接 inline style，不依賴 emoji 顏色或外部 CSS。
  btn.innerHTML = muted
    ? '<span aria-hidden="true">🔇</span> <span>靜音</span>'
    : '<span aria-hidden="true">🔊</span> <span>有聲</span>';

  btn.style.cssText = muted

async function exportFinishedSong(){
  if(!timelineClips.length) return alert('請先加入並剪輯音樂。');

  stopTimeline();

  const audibleClips=timelineClips.filter(c=>isTrackAudible(c.track));
  if(!audibleClips.length) return alert('目前所有音軌都是靜音，沒有可輸出的聲音。');

  const duration=audibleClips.reduce((m,c)=>Math.max(m,clipEnd(c)),0);
  if(duration<=0) return alert('目前沒有可輸出的內容。');

  const btn=[...document.querySelectorAll('.editor-topbar .ed-btn')].find(b=>b.textContent.includes('剪輯完成'));
  const oldText=btn?btn.textContent:'';
  if(btn){btn.disabled=true;btn.textContent='⏳ 輸出中...';}

  try{
    const sampleRate=44100;
    const OfflineCtx=window.OfflineAudioContext||window.webkitOfflineAudioContext;
    if(!OfflineCtx) throw new Error('此瀏覽器不支援離線音訊輸出');

    const offline=new OfflineCtx(2,Math.ceil(duration*sampleRate),sampleRate);

    audibleClips.forEach(c=>{
      const srcInfo=editorSources[c.sourceIndex];
      if(!srcInfo||!srcInfo.buffer) return;
      const node=offline.createBufferSource();
      node.buffer=srcInfo.buffer;
      node.connect(offline.destination);
      const len=clipDuration(c);
      if(len>0) node.start(Math.max(0,c.timelineStart),Math.max(0,c.start),len);
    });

    const rendered=await offline.startRendering();
    const wavBlob=audioBufferToWavBlob(rendered);
    finishedSongBlob=wavBlob;

    if(finishedSongUrl) URL.revokeObjectURL(finishedSongUrl);
    finishedSongUrl=URL.createObjectURL(wavBlob);

    const area=document.getElementById('finishedSongArea');
    const player=document.getElementById('finishedSongPlayer');
    const download=document.getElementById('finishedSongDownload');

    player.src=finishedSongUrl;
    setupFinishedPlayer();
    area.style.display='block';
    area.scrollIntoView({behavior:'smooth',block:'nearest'});
  }catch(err){
    console.error(err);
    alert('輸出失敗：'+(err&&err.message?err.message:'請重新試一次'));
  }finally{
    if(btn){btn.disabled=false;btn.textContent=oldText||'✅ 剪輯完成';}
  }
}

function audioBufferToWavBlob(buffer){
  const channels=buffer.numberOfChannels;
  const sampleRate=buffer.sampleRate;
  const frames=buffer.length;
  const bytesPerSample=2;
  const blockAlign=channels*bytesPerSample;
  const dataSize=frames*blockAlign;
  const ab=new ArrayBuffer(44+dataSize);
  const view=new DataView(ab);

  function writeString(offset,str){
    for(let i=0;i<str.length;i++) view.setUint8(offset+i,str.charCodeAt(i));
  }

  writeString(0,'RIFF');
  view.setUint32(4,36+dataSize,true);
  writeString(8,'WAVE');
  writeString(12,'fmt ');
  view.setUint32(16,16,true);
  view.setUint16(20,1,true);
  view.setUint16(22,channels,true);
  view.setUint32(24,sampleRate,true);
  view.setUint32(28,sampleRate*blockAlign,true);
  view.setUint16(32,blockAlign,true);
  view.setUint16(34,16,true);
  writeString(36,'data');
  view.setUint32(40,dataSize,true);

  const channelData=[];
  for(let ch=0;ch<channels;ch++) channelData.push(buffer.getChannelData(ch));

  let offset=44;
  for(let i=0;i<frames;i++){
    for(let ch=0;ch<channels;ch++){
      let s=Math.max(-1,Math.min(1,channelData[ch][i]));
      view.setInt16(offset,s<0?s*0x8000:s*0x7fff,true);
      offset+=2;
    }
  }
  return new Blob([ab],{type:'audio/wav'});
}

    const start=p+30+nameLen+extraLen;
    files[name]=b.slice(start,start+compSize);
    p=start+compSize;
  }
  return files;
}

    const safeName=`sources/${String(i+1).padStart(2,'0')}_${sanitizeProjectName(originalName)}`;
    let bytes;
    if(s.file&&s.file.arrayBuffer) bytes=new Uint8Array(await s.file.arrayBuffer());
    else throw new Error('找不到原始音樂素材，無法建立可重新編輯的工作包。');
    entries.push({name:safeName,data:bytes});
    sourceMeta.push({path:safeName,name:originalName,type:(s.file&&s.file.type)||'application/octet-stream',isEffect:!!s.isEffect});
  }

  const project={
    format:'TDS_FREESTYLE_PROJECT',
    version:1,
    savedAt:new Date().toISOString(),
    clips:timelineClips,
    trackAudioStates:trackAudioStates,
    sources:sourceMeta
  };
  entries.unshift({name:'project.json',data:enc.encode(JSON.stringify(project))});
  entries.push({name:'自由品勢_剪輯完整版.wav',data:new Uint8Array(await finishedSongBlob.arrayBuffer())});

  const zip=makeStoreZip(entries);
  const url=URL.createObjectURL(zip);
  const a=document.createElement('a');
  a.href=url;a.download=`自由品勢剪輯_${stamp}.zip`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}

async function openWorkPackage(file){
  if(!file)return;
  try{
    stopTimeline();
    const files=readStoreZip(await file.arrayBuffer());
    if(!files['project.json'])throw new Error('工作包內找不到 project.json。');
    const project=JSON.parse(new TextDecoder().decode(files['project.json']));
    if(project.format!=='TDS_FREESTYLE_PROJECT')throw new Error('這不是自由品勢剪輯工作包。');

    const AudioCtx=window.AudioContext||window.webkitAudioContext;
    if(!editorAudioContext)editorAudioContext=new AudioCtx();

    const loadedSources=[];
    for(const meta of project.sources||[]){
      const bytes=files[meta.path];
      if(!bytes)throw new Error('工作包缺少原始音樂：'+meta.name);
      const blob=new Blob([bytes],{type:meta.type||'application/octet-stream'});
      const f=new File([blob],meta.name,{type:meta.type||'application/octet-stream'});
      const ab=await f.arrayBuffer();
      const buffer=await editorAudioContext.decodeAudioData(ab.slice(0));
      loadedSources.push({file:f,buffer,isEffect:!!meta.isEffect});
    }

    editorSources=loadedSources;
    timelineClips=Array.isArray(project.clips)?project.clips:[];
    trackAudioStates=project.trackAudioStates||{};
    selectedClipId=null;
    editorPlayhead=0;
    historyStack=[];redoStack=[];
    finishedSongBlob=null;
    if(finishedSongUrl){URL.revokeObjectURL(finishedSongUrl);finishedSongUrl=null;}

  }catch(err){
    console.error(err);
    alert('工作包開啟失敗：'+(err&&err.message?err.message:'檔案無法讀取'));
  }
}

          formatTime(audio.currentTime) +

<script>

   ====================================== */

const SITE_PASSWORD = "05170517";


/* ======================================
   檢查密碼
   ====================================== */

function checkPassword() {

  const input =
    document.getElementById(
      "sitePassword"
    );

  const error =
    document.getElementById(
      "passwordError"
    );


  if (
    input.value === SITE_PASSWORD
  ) {

    document
      .getElementById(
        "loginScreen"
      )
      .style
      .display = "none";


  } else {

    error.textContent =
      "密碼錯誤，請重新輸入";


    input.value = "";


    input.focus();

  }

}
