<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <!-- ==================================================
       【開始】01－網頁基本設定

       【作用】
       1. 設定繁體中文
       2. 設定手機與電腦顯示比例
       3. 設定瀏覽器分頁名稱
  ================================================== -->

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>自由品勢音樂庫</title>

  <!-- ==================================================
       【結束】01－網頁基本設定
  ================================================== -->


  <style>

    /* ==================================================
       【開始】02－全網站基本外觀

       【作用】
       設定：
       1. 網站背景
       2. 字體
       3. 文字顏色
       4. 基本尺寸
    ================================================== */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #0b0b12;
      color: white;
    }

    /* ==================================================
       【結束】02－全網站基本外觀
    ================================================== */



    /* ==================================================
       【開始】03－網站標題外觀

       【作用】
       控制最上方：
       「自由品勢音樂庫」
       「自由品勢音樂線上試聽」
    ================================================== */

    .header {
      width: 100%;
      text-align: center;
      padding: 42px 20px 32px;

      background:
        linear-gradient(
          135deg,
          #101018,
          #24104d
        );
    }

    .header h1 {
      margin: 0;
      font-size: 36px;
      font-weight: bold;
    }

    .header p {
      margin: 10px 0 0;
      color: #c9c9d8;
      font-size: 16px;
    }

    /* ==================================================
       【結束】03－網站標題外觀
    ================================================== */



    /* ==================================================
       【開始】04－音樂列表外觀

       【作用】
       控制所有歌曲卡片的寬度與位置
    ================================================== */

    .music-list {
      width: 92%;
      max-width: 850px;
      margin: 30px auto 60px;
    }

    /* ==================================================
       【結束】04－音樂列表外觀
    ================================================== */



    /* ==================================================
       【開始】05－歌曲卡片外觀

       【作用】
       控制單首歌曲：
       1. 背景
       2. 邊框
       3. 圓角
       4. 內部間距
    ================================================== */

    .music-card {
      padding: 20px;
      background: #15151e;
      border: 1px solid #30303d;
      border-radius: 18px;
    }

    .music-title {
      margin: 0;
      font-size: 21px;
    }

    .music-info {
      margin-top: 8px;
      color: #9999aa;
      font-size: 14px;
    }

    /* ==================================================
       【結束】05－歌曲卡片外觀
    ================================================== */



    /* ==================================================
       【開始】06－播放器整體外觀

       【作用】
       控制白色播放器：
       1. 播放按鈕
       2. 時間
       3. 進度條
       4. 音量
    ================================================== */

    .player {
      display: flex;
      align-items: center;
      gap: 10px;

      width: 100%;
      margin-top: 20px;
      padding: 10px 12px;

      background: white;
      color: #222;

      border-radius: 50px;
    }

    /* ==================================================
       【結束】06－播放器整體外觀
    ================================================== */



    /* ==================================================
       【開始】07－播放／暫停按鈕外觀

       【作用】
       控制紫色圓形 ▶ 按鈕的外觀
       這裡只控制外觀，不控制播放功能
    ================================================== */

    .play-button {
      width: 46px;
      height: 46px;

      flex-shrink: 0;

      border: none;
      border-radius: 50%;

      background: #6c45e8;
      color: white;

      font-size: 18px;

      cursor: pointer;
    }

    /* ==================================================
       【結束】07－播放／暫停按鈕外觀
    ================================================== */



    /* ==================================================
       【開始】08－播放時間外觀

       【作用】
       顯示例如：
       0:00 / 1:34
    ================================================== */

    .time-display {
      min-width: 90px;
      text-align: center;
      font-size: 12px;
      white-space: nowrap;
    }

    /* ==================================================
       【結束】08－播放時間外觀
    ================================================== */



    /* ==================================================
       【開始】09－播放進度條外觀

       【作用】
       控制播放進度條的寬度
    ================================================== */

    .progress-bar {
      flex: 1;
      min-width: 50px;
      cursor: pointer;
    }

    /* ==================================================
       【結束】09－播放進度條外觀
    ================================================== */



    /* ==================================================
       【開始】10－音量外觀

       【作用】
       控制：
       1. 🔊 音量圖示
       2. 音量拉桿
    ================================================== */

    .volume-icon {
      font-size: 18px;
      flex-shrink: 0;
      cursor: pointer;
      user-select: none;
    }

    .volume-control {
      width: 75px;
      cursor: pointer;
    }

    /* ==================================================
       【結束】10－音量外觀
    ================================================== */



    /* ==================================================
       【開始】11－音樂載入狀態

       【作用】
       顯示 music01.mp3 是否成功讀取。

       成功：
       顯示「✓ 音樂已載入」

       失敗：
       顯示「⚠ music01.mp3 載入失敗」

       這一區方便我們以後檢查問題。
    ================================================== */

    .music-status {
      margin-top: 14px;
      font-size: 13px;
      color: #aaaabd;
    }

    .music-status.success {
      color: #69db7c;
    }

    .music-status.error {
      color: #ff6b6b;
    }

    /* ==================================================
       【結束】11－音樂載入狀態
    ================================================== */



    /* ==================================================
       【開始】12－音樂檔測試播放器

       【作用】
       這是檢查 music01.mp3 用的播放器。

       現在先顯示出來。

       只要這個播放器可以播放，
       就代表 music01.mp3 的檔案與路徑正常。

       等確認全部正常後，
       這個測試播放器可以再隱藏。
    ================================================== */

    .audio-test {
      display: block;
      width: 100%;
      margin-top: 15px;
    }

    /* ==================================================
       【結束】12－音樂檔測試播放器
    ================================================== */



    /* ==================================================
       【開始】13－手機版外觀

       【作用】
       手機螢幕小於 650px 時，
       自動縮小播放器與文字
    ================================================== */

    @media (max-width: 650px) {

      .header {
        padding: 34px 15px 26px;
      }

      .header h1 {
        font-size: 29px;
      }

      .header p {
        font-size: 14px;
      }

      .music-list {
        width: 94%;
        margin-top: 20px;
      }

      .music-card {
        padding: 16px;
      }

      .player {
        gap: 6px;
        padding: 8px;
      }

      .play-button {
        width: 42px;
        height: 42px;
      }

      .time-display {
        min-width: 76px;
        font-size: 11px;
      }

      .volume-control {
        width: 50px;
      }

    }

    /* ==================================================
       【結束】13－手機版外觀
    ================================================== */

  </style>

</head>


<body>


  <!-- ==================================================
       【開始】14－網站標題

       【作用】
       顯示：
       自由品勢音樂庫
       自由品勢音樂線上試聽
  ================================================== -->

  <header class="header">

    <h1>
      自由品勢音樂庫
    </h1>

    <p>
      自由品勢音樂線上試聽
    </p>

  </header>

  <!-- ==================================================
       【結束】14－網站標題
  ================================================== -->



  <!-- ==================================================
       【開始】15－音樂列表

       【作用】
       所有歌曲都放在這個區域。

       以後：
       music01
       music02
       music03
       都放在這裡。
  ================================================== -->

  <main class="music-list">


    <!-- ==================================================
         【開始】16－第一首歌曲 music01

         【作用】
         管理第一首歌曲全部內容：

         1. 歌曲名稱
         2. 歌曲資料
         3. MP3檔案
         4. 測試播放器
         5. 正式播放器
    ================================================== -->

    <section class="music-card">


      <!-- ==================================================
           【開始】16-01－歌曲名稱

           【作用】
           顯示第一首歌曲名稱
      ================================================== -->

      <h2 class="music-title">
        自由品勢音樂 01
      </h2>

      <!-- ==================================================
           【結束】16-01－歌曲名稱
      ================================================== -->



      <!-- ==================================================
           【開始】16-02－歌曲資料

           【作用】
           顯示歌曲類型、用途與秒數
      ================================================== -->

      <div class="music-info">
        純音樂｜自由品勢｜94秒
      </div>

      <!-- ==================================================
           【結束】16-02－歌曲資料
      ================================================== -->



      <!-- ==================================================
           【開始】16-03－正式音樂檔案

           【作用】
           指定第一首歌曲真正使用的 MP3。

           現在指定：
           music01.mp3

           GitHub 必須是：

           taekwondo-music
           ├── index.html
           └── music01.mp3

           兩個檔案在同一層。

           【以後如果換歌】
           修改：
           src="./music01.mp3"
      ================================================== -->

      <audio
        id="music01"
        preload="metadata"
      >

        <source
          src="./music01.mp3"
          type="audio/mpeg"
        >

        您的瀏覽器不支援音樂播放。

      </audio>

      <!-- ==================================================
           【結束】16-03－正式音樂檔案
      ================================================== -->



      <!-- ==================================================
           【開始】16-04－音樂載入狀態

           【作用】
           告訴我們 MP3 有沒有成功載入。

           一開始：
           「正在讀取 music01.mp3...」

           成功：
           「✓ 音樂已載入」

           失敗：
           「⚠ music01.mp3 載入失敗」
      ================================================== -->

      <div
        id="musicStatus"
        class="music-status"
      >
        正在讀取 music01.mp3...
      </div>

      <!-- ==================================================
           【結束】16-04－音樂載入狀態
      ================================================== -->



      <!-- ==================================================
           【開始】16-05－音樂檔測試

           【作用】
           直接使用瀏覽器自己的播放器
           測試 music01.mp3。

           目前故意顯示。

           如果這裡能播放，
           代表 MP3 檔案完全正常。

           等全部測試完成，
           我們再把這個測試播放器隱藏。
      ================================================== -->

      <audio
        class="audio-test"
        controls
        preload="metadata"
      >

        <source
          src="./music01.mp3"
          type="audio/mpeg"
        >

        您的瀏覽器無法播放此音樂。

      </audio>

      <!-- ==================================================
           【結束】16-05－音樂檔測試
      ================================================== -->



      <!-- ==================================================
           【開始】16-06－正式播放器

           【作用】
           正式播放器包含：

           ▶ 播放
           ⏸ 暫停
           播放時間
           進度條
           🔊 音量
      ================================================== -->

      <div class="player">


        <!-- ==================================================
             【開始】16-06-01－播放／暫停按鈕

             【作用】
             ▶ = 播放
             ⏸ = 暫停
        ================================================== -->

        <button
          id="playButton"
          class="play-button"
          type="button"
          aria-label="播放或暫停"
        >
          ▶
        </button>

        <!-- ==================================================
             【結束】16-06-01－播放／暫停按鈕
        ================================================== -->



        <!-- ==================================================
             【開始】16-06-02－播放時間

             【作用】
             顯示：
             目前時間 / 總時間

             例如：
             0:25 / 1:34
        ================================================== -->

        <div
          id="timeDisplay"
          class="time-display"
        >
          0:00 / 0:00
        </div>

        <!-- ==================================================
             【結束】16-06-02－播放時間
        ================================================== -->



        <!-- ==================================================
             【開始】16-06-03－播放進度條

             【作用】
             1. 顯示播放位置
             2. 可以左右拖動
             3. 可以跳到指定時間
        ================================================== -->

        <input
          id="progressBar"
          class="progress-bar"
          type="range"
          min="0"
          max="100"
          value="0"
          step="0.1"
          aria-label="播放進度"
        >

        <!-- ==================================================
             【結束】16-06-03－播放進度條
        ================================================== -->



        <!-- ==================================================
             【開始】16-06-04－音量圖示

             【作用】
             顯示目前音量狀態：

             🔊 有聲音
             🔉 小聲
             🔇 靜音

             點一下可以靜音／恢復
        ================================================== -->

        <span
          id="volumeIcon"
          class="volume-icon"
          role="button"
          tabindex="0"
          aria-label="靜音或恢復聲音"
        >
          🔊
        </span>

        <!-- ==================================================
             【結束】16-06-04－音量圖示
        ================================================== -->



        <!-- ==================================================
             【開始】16-06-05－音量拉桿

             【作用】
             左右拉動調整音量。

             0 = 靜音
             1 = 最大聲
        ================================================== -->

        <input
          id="volumeControl"
          class="volume-control"
          type="range"
          min="0"
          max="1"
          value="1"
          step="0.01"
          aria-label="音量"
        >

        <!-- ==================================================
             【結束】16-06-05－音量拉桿
        ================================================== -->


      </div>

      <!-- ==================================================
           【結束】16-06－正式播放器
      ================================================== -->


    </section>

    <!-- ==================================================
         【結束】16－第一首歌曲 music01
    ================================================== -->


  </main>

  <!-- ==================================================
       【結束】15－音樂列表
  ================================================== -->



  <script>


    /* ==================================================
       【開始】17－播放器元件連接

       【作用】
       讓程式找到：

       1. music01.mp3
       2. 播放按鈕
       3. 時間
       4. 進度條
       5. 音量圖示
       6. 音量拉桿
       7. 音樂載入狀態
    ================================================== */

    const audio =
      document.getElementById("music01");

    const playButton =
      document.getElementById("playButton");

    const timeDisplay =
      document.getElementById("timeDisplay");

    const progressBar =
      document.getElementById("progressBar");

    const volumeIcon =
      document.getElementById("volumeIcon");

    const volumeControl =
      document.getElementById("volumeControl");

    const musicStatus =
      document.getElementById("musicStatus");

    /* ==================================================
       【結束】17－播放器元件連接
    ================================================== */



    /* ==================================================
       【開始】18－時間格式轉換

       【作用】
       把秒數轉成分鐘：秒數。

       例如：

       25秒 → 0:25
       94秒 → 1:34
       95秒 → 1:35
    ================================================== */

    function formatTime(seconds) {

      if (!Number.isFinite(seconds)) {
        return "0:00";
      }

      const minutes =
        Math.floor(seconds / 60);

      const remainingSeconds =
        Math.floor(seconds % 60);

      return (
        minutes +
        ":" +
        String(remainingSeconds).padStart(2, "0")
      );

    }

    /* ==================================================
       【結束】18－時間格式轉換
    ================================================== */



    /* ==================================================
       【開始】19－確認音樂成功載入

       【作用】
       music01.mp3 成功讀取後：

       1. 顯示 ✓ 音樂已載入
       2. 顯示歌曲真正總時間
    ================================================== */

    audio.addEventListener(
      "loadedmetadata",
      function () {

        musicStatus.textContent =
          "✓ 音樂已載入";

        musicStatus.className =
          "music-status success";

        timeDisplay.textContent =
          "0:00 / " +
          formatTime(audio.duration);

      }
    );

    /* ==================================================
       【結束】19－確認音樂成功載入
    ================================================== */



    /* ==================================================
       【開始】20－音樂載入失敗檢查

       【作用】
       如果找不到 music01.mp3：

       顯示：
       ⚠ music01.mp3 載入失敗

       這樣我們可以立刻知道是檔案問題，
       而不是播放器按鈕問題。
    ================================================== */

    audio.addEventListener(
      "error",
      function () {

        musicStatus.textContent =
          "⚠ music01.mp3 載入失敗";

        musicStatus.className =
          "music-status error";

        console.error(
          "找不到 music01.mp3，請確認它和 index.html 在同一層，而且檔名完全相同。"
        );

      }
    );

    /* ==================================================
       【結束】20－音樂載入失敗檢查
    ================================================== */



    /* ==================================================
       【開始】21－播放／暫停功能

       【作用】

       音樂停止時按 ▶：
       開始播放。

       音樂播放中按 ⏸：
       暫停播放。
    ================================================== */

    playButton.addEventListener(
      "click",
      function () {

        if (audio.paused) {

          audio.play()
            .then(function () {

              playButton.textContent =
                "⏸";

            })
            .catch(function (error) {

              console.error(
                "音樂播放失敗：",
                error
              );

              alert(
                "音樂無法播放，請先查看上方的音樂載入狀態。"
              );

            });

        } else {

          audio.pause();

          playButton.textContent =
            "▶";

        }

      }
    );

    /* ==================================================
       【結束】21－播放／暫停功能
    ================================================== */



    /* ==================================================
       【開始】22－播放時間自動更新

       【作用】
       播放音樂時自動更新：

       1. 現在播放到幾秒
       2. 歌曲總長度
       3. 進度條位置
    ================================================== */

    audio.addEventListener(
      "timeupdate",
      function () {

        timeDisplay.textContent =
          formatTime(audio.currentTime) +
          " / " +
          formatTime(audio.duration);

        if (
          Number.isFinite(audio.duration) &&
          audio.duration > 0
        ) {

          progressBar.value =
            (
              audio.currentTime /
              audio.duration
            ) * 100;

        }

      }
    );

    /* ==================================================
       【結束】22－播放時間自動更新
    ================================================== */



    /* ==================================================
       【開始】23－拖動播放進度

       【作用】
       用滑鼠或手指拖動進度條，
       可以跳到歌曲指定的位置。
    ================================================== */

    progressBar.addEventListener(
      "input",
      function () {

        if (
          !Number.isFinite(audio.duration) ||
          audio.duration <= 0
        ) {
          return;
        }

        audio.currentTime =
          (
            Number(progressBar.value) /
            100
          ) *
          audio.duration;

      }
    );

    /* ==================================================
       【結束】23－拖動播放進度
    ================================================== */



    /* ==================================================
       【開始】24－音量拉桿功能

       【作用】
       左右拖動調整音量。

       同時自動顯示：

       🔇 靜音
       🔉 小聲
       🔊 正常
    ================================================== */

    volumeControl.addEventListener(
      "input",
      function () {

        const volume =
          Number(volumeControl.value);

        audio.volume =
          volume;

        audio.muted =
          false;

        if (volume === 0) {

          volumeIcon.textContent =
            "🔇";

        } else if (volume < 0.5) {

          volumeIcon.textContent =
            "🔉";

        } else {

          volumeIcon.textContent =
            "🔊";

        }

      }
    );

    /* ==================================================
       【結束】24－音量拉桿功能
    ================================================== */



    /* ==================================================
       【開始】25－點音量圖示靜音

       【作用】

       點 🔊：
       變成 🔇 並靜音。

       再點 🔇：
       恢復原本音量。
    ================================================== */

    volumeIcon.addEventListener(
      "click",
      function () {

        audio.muted =
          !audio.muted;

        if (audio.muted) {

          volumeIcon.textContent =
            "🔇";

        } else {

          const volume =
            Number(volumeControl.value);

          if (volume === 0) {

            volumeIcon.textContent =
              "🔇";

          } else if (volume < 0.5) {

            volumeIcon.textContent =
              "🔉";

          } else {

            volumeIcon.textContent =
              "🔊";

          }

        }

      }
    );

    /* ==================================================
       【結束】25－點音量圖示靜音
    ================================================== */



    /* ==================================================
       【開始】26－歌曲播放完畢

       【作用】
       歌曲播放完後：

       1. 按鈕恢復 ▶
       2. 時間回到 0:00
       3. 進度條回到最前面
    ================================================== */

    audio.addEventListener(
      "ended",
      function () {

        playButton.textContent =
          "▶";

        progressBar.value =
          0;

        audio.currentTime =
          0;

        timeDisplay.textContent =
          "0:00 / " +
          formatTime(audio.duration);

      }
    );

    /* ==================================================
       【結束】26－歌曲播放完畢
    ================================================== */


  </script>


</body>

</html>
